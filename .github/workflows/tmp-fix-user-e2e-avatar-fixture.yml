name: Temporary Fix User E2E Avatar Fixture

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-user-e2e-avatar-fixture.yml'

permissions:
  contents: write

jobs:
  fix-avatar-fixture:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace exact corrupt PNG fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-risk/e2e/user-system/user-system.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII='
          new = 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGNUcEhgYGBgYmBgYGBgAAAI6gDEJfpPsQAAAABJRU5ErkJggg=='
          if source.count(old) != 1:
              raise SystemExit('Expected corrupt PNG fixture was not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit valid avatar fixture
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/e2e/user-system/user-system.spec.ts
          git commit -m 'test(user-system): use valid avatar PNG fixture'
          git push
