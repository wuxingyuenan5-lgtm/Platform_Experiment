name: Venue Reconciliation Route Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/venue-reconciliation-route-extraction.yml
      - scripts/apply-venue-reconciliation-route-extraction.py

permissions:
  contents: write

concurrency:
  group: venue-reconciliation-route-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Venue route extraction
        run: python scripts/apply-venue-reconciliation-route-extraction.py

      - name: Install Platform API
        run: python -m pip install -e './platform-api[dev]'

      - name: Validate exact Venue boundary
        run: |
          python -m ruff check \
            platform-api/app/venue_reconciliation.py \
            platform-api/app/venue_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_venue_reconciliation_service.py
          cd platform-api
          python -m pyright
          python -m pytest -q \
            tests/test_architecture_venue_reconciliation_service.py \
            tests/test_venue_reconciliation.py \
            tests/test_venue_reconciliation_service.py \
            tests/test_venue_reconciliation_policy.py \
            tests/test_venue_reconciliation_runtime_client.py \
            tests/test_venue_reconciliation_decimal.py \
            tests/test_eod_reconciliation.py
          cd ..
          python scripts/check-documentation-consistency.py
          git diff --check

      - name: Push validated extraction
        run: |
          if git diff --quiet -- \
            platform-api/app/venue_reconciliation.py \
            platform-api/app/venue_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_venue_reconciliation_service.py \
            docs/architecture/OWNERSHIP.md; then
            echo 'Venue route extraction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform-api/app/venue_reconciliation.py \
            platform-api/app/venue_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_venue_reconciliation_service.py \
            docs/architecture/OWNERSHIP.md
          git commit -m 'refactor: extract Venue reconciliation routes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
