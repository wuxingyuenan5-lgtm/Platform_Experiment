name: One-time Backend Behavior Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: backend-behavior-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded backend test-contract repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(relative: str, old: str, new: str) -> None:
              path = root / relative
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'expected pattern missing in {relative}: {old[:100]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/test_cross_spread_exit_execution_modes.py',
              '    apply_migrations(db, PLATFORM_MIGRATIONS)\n\n    row = db.execute(',
              '    apply_migrations(db, PLATFORM_MIGRATIONS[:3])\n\n    row = db.execute(',
          )
          replace_once(
              'tests/test_cross_spread_limit_strategies.py',
              '    apply_migrations(db, PLATFORM_MIGRATIONS)\n\n    intent = db.execute(',
              '    apply_migrations(db, PLATFORM_MIGRATIONS[:4])\n\n    intent = db.execute(',
          )
          replace_once(
              'tests/test_member_holding_scope.py',
              '        assert "Human browser session" in denied.json()["detail"]',
              '        assert "Human browser session" in denied.json()["detail"]["message"]',
          )
          replace_once(
              'tests/test_user_logout.py',
              '        assert get_settings().session_cookie_name not in client.cookies',
              '        set_cookie = response.headers["set-cookie"]\n'
              '        assert f"{get_settings().session_cookie_name}=\"\"" in set_cookie\n'
              '        assert "Max-Age=0" in set_cookie\n'
              '        assert "Path=/" in set_cookie',
          )
          session_path = root / 'tests/test_user_session_foundation.py'
          session_source = session_path.read_text(encoding='utf-8')
          if session_source.count('http://localhost:5173') != 2:
              raise SystemExit('expected exactly two stale CSRF origin references')
          session_path.write_text(
              session_source.replace('http://localhost:5173', 'http://localhost:4373'),
              encoding='utf-8',
          )
          PY
          python -m ruff check --fix tests/test_cross_spread_exit_execution_modes.py \
            tests/test_cross_spread_limit_strategies.py \
            tests/test_member_holding_scope.py \
            tests/test_user_logout.py \
            tests/test_user_session_foundation.py
          git diff --check
      - name: Backend lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check app tests 2>&1 | tee "$RUNNER_TEMP/backend-behavior-ruff.log"
      - name: Backend type check
        id: type_check
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pyright 2>&1 | tee "$RUNNER_TEMP/backend-behavior-pyright.log"
      - name: Backend tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -m "architecture or unit or integration or live_safety" 2>&1 | tee "$RUNNER_TEMP/backend-behavior-pytest.log"
      - name: Upload backend behavior repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-behavior-repair-diagnostics
          path: |
            ${{ runner.temp }}/backend-behavior-ruff.log
            ${{ runner.temp }}/backend-behavior-pyright.log
            ${{ runner.temp }}/backend-behavior-pytest.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce repair validation
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.type_check.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
      - name: Commit validated backend behavior repair
        run: |
          set -euo pipefail
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add platform-backend
          git -C .. -c core.hooksPath=/dev/null commit -m "test: align user-system integration contracts"
          git -C .. push origin "HEAD:${{ github.event.pull_request.head.ref }}"
