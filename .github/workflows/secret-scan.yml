name: Secret Scan

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked files
        id: scan
        shell: bash
        run: |
          set +e
          python scripts/scan-secrets.py > /tmp/secret-scan.log 2>&1
          status=$?
          cat /tmp/secret-scan.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload scan diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-log
          path: /tmp/secret-scan.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce scan result
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
