name: Fix Phase 1 Ruff Once

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/fix-phase1-ruff-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant EOD row query
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/eod_reconciliation.py')
          source = path.read_text(encoding='utf-8')
          redundant = '''\
                  row = db.execute(
                      "SELECT * FROM eod_reconciliation_reports WHERE id = ?",
                      (report_id,),
                  ).fetchone()
          '''
          if source.count(redundant) != 1:
              raise RuntimeError('Expected one redundant EOD report query')
          path.write_text(source.replace(redundant, '', 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-phase1-ruff-once.yml
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Validate backend
        working-directory: platform-backend
        run: |
          python -m ruff check app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py app/execution_exposure.py tests/test_architecture_boundaries.py
          python -m pytest
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/eod_reconciliation.py
          git add -u .github/workflows/fix-phase1-ruff-once.yml
          git commit -m 'fix: remove redundant EOD report query'
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
