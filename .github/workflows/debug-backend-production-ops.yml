name: Debug Production Operations Backend

on:
  push:
    branches:
      - hardening/v6-production-gate-observability-backup-restore
    paths:
      - '.github/workflows/debug-backend-production-ops.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v6-production-gate-observability-backup-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          cd platform-backend
          python -m pytest tests/test_disaster_recovery.py tests/test_production_monitoring.py -vv > /tmp/production-ops-pytest.log 2>&1
          status=$?
          cd ..
          mkdir -p debug
          {
            echo "exit_code=$status"
            tail -n 500 /tmp/production-ops-pytest.log
          } > debug/production-ops-pytest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/production-ops-pytest.log
          git commit -m "chore: capture production operations test diagnostics" || true
          git push origin HEAD:hardening/v6-production-gate-observability-backup-restore
