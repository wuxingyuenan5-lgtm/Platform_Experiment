name: Research Macro Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/research-macro-extraction.yml
      - scripts/apply-research-macro-extraction.py
      - platform-api/app/research_provider_errors.py
      - platform-api/app/research_provider_macro.py
      - platform-api/tests/test_research_provider_macro.py
      - platform-api/pyproject.toml

permissions:
  contents: write

concurrency:
  group: research-macro-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml

      - name: Install Platform API development dependencies
        run: python -m pip install -e 'platform-api[dev]'

      - name: Apply mechanical extraction
        run: python scripts/apply-research-macro-extraction.py

      - name: Validate extraction
        run: |
          python -m ruff check \
            platform-api/app/research_provider_errors.py \
            platform-api/app/research_provider_macro.py \
            platform-api/app/research_provider_normalization.py \
            platform-api/app/research_providers.py \
            platform-api/tests/test_research_provider_macro.py
          cd platform-api
          python -m pyright
          python -m pytest \
            tests/test_research_provider_macro.py \
            tests/test_research_provider_normalization.py \
            tests/test_research_service.py \
            tests/test_a_share_research_policy.py \
            -q
          cd ..
          git diff --check

      - name: Push macro extraction commit
        run: |
          if git diff --quiet -- platform-api/app/research_providers.py; then
            echo 'Macro provider extraction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-api/app/research_providers.py
          git commit -m 'refactor: delegate macro research provider'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
