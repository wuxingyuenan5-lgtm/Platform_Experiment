name: Temporary Verify User Route Denial

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-user-route-denial.yml'

permissions:
  contents: write

jobs:
  verify-route-denial:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add exact route-denial policy test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-risk/scripts/test-user-system-access.cjs')
          source = path.read_text(encoding='utf-8')
          marker = "test('route tree filtering removes denied branches without mutating source', () => {\n"
          addition = """test('known static routes distinguish permission denial from genuine not-found paths', () => {
            const routes = [
              {
                path: '/risk',
                meta: { permissions: 'risk.read' },
                children: [
                  { path: 'users', meta: { permissions: 'user.read' } },
                  { path: 'detail', meta: { permissions: 'risk.read' } },
                ],
              },
              {
                path: '/:path(.*)*',
                children: [{ path: '/:path(.*)*' }],
              },
            ];

            const chain = routeAccess.findRouteChainByPath(routes, '/risk/users?from=e2e');
            assert.equal(chain.length, 2);
            assert.equal(routeAccess.isKnownRouteDenied(routes, '/risk/users', []), true);
            assert.equal(
              routeAccess.isKnownRouteDenied(routes, '/risk/users', ['risk.read', 'user.read']),
              false,
            );
            assert.equal(routeAccess.findRouteChainByPath(routes, '/missing'), undefined);
            assert.equal(routeAccess.isKnownRouteDenied(routes, '/missing', []), false);
          });

          """
          if source.count(marker) != 1 or 'known static routes distinguish' in source:
              raise SystemExit('Expected route test insertion point was not found exactly once')
          path.write_text(source.replace(marker, addition + marker), encoding='utf-8')
          PY
          git diff --check

      - name: Install frontend dependencies
        working-directory: admin-risk
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Verify direct URL denial
        working-directory: admin-risk
        run: |
          pnpm test:user-system
          pnpm exec eslint --max-warnings 0 src/access/routeAccess.ts src/router/guard/permissionGuard.ts
          pnpm exec vue-tsc -p tsconfig.user-system.json --noEmit --skipLibCheck

      - name: Commit route-denial policy test
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/scripts/test-user-system-access.cjs
          git commit -m 'test(user-system): cover denied direct URLs'
          git push
