name: Phase 4A Codegen

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_phase4a.py'
      - '.github/workflows/phase4a-codegen.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 4A
        run: python scripts/apply_phase4a.py
      - name: Install backend
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Validate backend
        working-directory: platform-backend
        run: |
          python -m ruff check app tests
          python -m pytest
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_phase4a.py .github/workflows/phase4a-codegen.yml
          git add .
          git commit -m "feat: add Phase 4A execution risk controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
