name: Phase 4A Codegen

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_phase4a.py'
      - 'scripts/fix_phase4a.py'
      - 'scripts/fix_phase4a_final.py'
      - '.github/workflows/phase4a-codegen.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 4A
        run: |
          python scripts/apply_phase4a.py
          python scripts/fix_phase4a.py
          python scripts/fix_phase4a_final.py
      - name: Install backend
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Format and validate backend
        working-directory: platform-backend
        shell: bash
        run: |
          python -m ruff check app tests --fix || true
          python -m ruff format app tests
          set +e
          python -m ruff check app tests > /tmp/phase4a-ruff.log 2>&1
          RUFF_STATUS=$?
          python -m pytest > /tmp/phase4a-pytest.log 2>&1
          PYTEST_STATUS=$?
          cat /tmp/phase4a-ruff.log
          cat /tmp/phase4a-pytest.log
          if [ $RUFF_STATUS -ne 0 ] || [ $PYTEST_STATUS -ne 0 ]; then exit 1; fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-validation
          path: |
            /tmp/phase4a-ruff.log
            /tmp/phase4a-pytest.log
            platform-backend/app/phase4_risk.py
            platform-backend/app/trade_commands.py
            platform-backend/app/trading.py
            platform-backend/app/schemas.py
            platform-backend/tests/test_phase4_risk.py
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add Phase 4A execution risk controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
