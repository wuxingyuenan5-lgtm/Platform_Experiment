name: Apply Phase 2 Runtime Cleanup

on:
  push:
    branches:
      - hardening/phase2-ci-coverage-and-structure
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase2-ci-coverage-and-structure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split unavoidable long lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cross_path = Path('execution-runtime/app/cross_spread_market.py')
          cross_source = cross_path.read_text(encoding='utf-8')
          cross_source = cross_source.replace(
              '                "MT5 Python bridge is not responding in the web runtime; keep terminal open and verify terminal bridge separately",\n',
              '                (\n'
              '                    "MT5 Python bridge is not responding in the web runtime; "\n'
              '                    "keep terminal open and verify terminal bridge separately"\n'
              '                ),\n',
              1,
          )
          cross_path.write_text(cross_source, encoding='utf-8')

          readiness_path = Path('execution-runtime/app/venue_readiness.py')
          readiness_source = readiness_path.read_text(encoding='utf-8')
          readiness_source = readiness_source.replace(
              '        print(json.dumps({"status": "unavailable", "checks": [], "reason": "MT5 initialize failed"}))\n',
              '        print(\n'
              '            json.dumps(\n'
              '                {\n'
              '                    "status": "unavailable",\n'
              '                    "checks": [],\n'
              '                    "reason": "MT5 initialize failed",\n'
              '                }\n'
              '            )\n'
              '        )\n',
              1,
          )
          readiness_source = readiness_source.replace(
              '        print(json.dumps({"status": "unavailable", "checks": ["login"], "reason": f"MT5 symbol not found: {symbol}"}))\n',
              '        print(\n'
              '            json.dumps(\n'
              '                {\n'
              '                    "status": "unavailable",\n'
              '                    "checks": ["login"],\n'
              '                    "reason": f"MT5 symbol not found: {symbol}",\n'
              '                }\n'
              '            )\n'
              '        )\n',
              1,
          )
          readiness_path.write_text(readiness_source, encoding='utf-8')
          PY
      - name: Install runtime tooling
        working-directory: execution-runtime
        run: python -m pip install -e '.[dev]'
      - name: Apply and verify Ruff cleanup
        working-directory: execution-runtime
        run: |
          python -m ruff check \
            app/cross_spread_market.py \
            app/venue_readiness.py \
            tests/test_gateway_factory.py \
            --fix
          python -m ruff format \
            app/cross_spread_market.py \
            app/venue_readiness.py \
            tests/test_gateway_factory.py
          python -m ruff check app tests
          python -m pytest
      - name: Commit validated runtime cleanup
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-phase1-capture.yml \
            .github/workflows/fix-phase2-runtime-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution-runtime
          git add -u .github/workflows
          git commit -m 'style: clear runtime Ruff debt'
          git push origin HEAD:hardening/phase2-ci-coverage-and-structure
