name: Apply Phase 2 Backend Cleanup

on:
  push:
    branches:
      - hardening/phase2-ci-coverage-and-structure
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase2-ci-coverage-and-structure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split backend long lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/cross_spread.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '        raise HTTPException(status_code=422, detail="Cross-spread contract specification is missing")\n',
              '        raise HTTPException(\n'
              '            status_code=422,\n'
              '            detail="Cross-spread contract specification is missing",\n'
              '        )\n',
              1,
          )
          source = source.replace(
              '        raise HTTPException(status_code=422, detail=f"{label} quantity does not match contract step")\n',
              '        raise HTTPException(\n'
              '            status_code=422,\n'
              '            detail=f"{label} quantity does not match contract step",\n'
              '        )\n',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Apply and verify Ruff cleanup
        working-directory: platform-backend
        run: |
          python -m ruff check app/cross_spread.py tests/test_cross_spread.py --fix
          python -m ruff format app/cross_spread.py tests/test_cross_spread.py
          python -m ruff check app tests
          python -m pytest
      - name: Commit validated backend cleanup
        shell: bash
        run: |
          rm .github/workflows/apply-phase1-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend
          git add -u .github/workflows/apply-phase1-capture.yml
          git commit -m 'style: clear backend Ruff debt'
          git push origin HEAD:hardening/phase2-ci-coverage-and-structure
