name: Apply Execution Schema Extraction

on:
  push:
    branches:
      - hardening/phase3-execution-schema-boundary
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase3-execution-schema-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract compatibility exports and add boundary tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('.')
          schemas_path = root / 'platform-backend/app/schemas.py'
          source = schemas_path.read_text(encoding='utf-8')
          start = source.index('class CreateOrderRequest(BaseModel):\n')
          end = source.index('class RuntimeReadinessResponse(BaseModel):\n', start)
          compatibility_import = dedent(
              '''\
              from app.execution_schemas import (
                  BatchLegRequest,
                  BatchLegResponse,
                  CreateExecutionBatchRequest,
                  CreateOrderRequest,
                  CreateStrategyRunRequest,
                  ExecutionBatchResponse,
                  OrderResponse,
                  PnlResponse,
                  PositionResponse,
                  StrategyRunResponse,
              )


              '''
          )
          schemas_path.write_text(
              source[:start] + compatibility_import + source[end:],
              encoding='utf-8',
          )

          test_path = root / 'platform-backend/tests/test_schema_boundaries.py'
          test_path.write_text(
              dedent(
                  '''\
                  from __future__ import annotations

                  import ast
                  from pathlib import Path

                  from app import execution_schemas, schemas

                  BACKEND_ROOT = Path(__file__).resolve().parents[1]
                  EXECUTION_SCHEMA_NAMES = (
                      "BatchLegRequest",
                      "BatchLegResponse",
                      "CreateExecutionBatchRequest",
                      "CreateOrderRequest",
                      "CreateStrategyRunRequest",
                      "ExecutionBatchResponse",
                      "OrderResponse",
                      "PnlResponse",
                      "PositionResponse",
                      "StrategyRunResponse",
                  )


                  def test_legacy_schema_imports_reexport_execution_types() -> None:
                      for name in EXECUTION_SCHEMA_NAMES:
                          assert getattr(schemas, name) is getattr(execution_schemas, name)


                  def test_cross_domain_schema_module_does_not_redefine_execution_types() -> None:
                      path = BACKEND_ROOT / "app/schemas.py"
                      tree = ast.parse(path.read_text(encoding="utf-8"))
                      defined_classes = {
                          node.name for node in tree.body if isinstance(node, ast.ClassDef)
                      }
                      assert defined_classes.isdisjoint(EXECUTION_SCHEMA_NAMES)
                  '''
              ),
              encoding='utf-8',
          )

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          rule = '- 执行域 API DTO 由 `platform-backend/app/execution_schemas.py` 统一维护，`app/schemas.py` 仅保留兼容导出。\n'
          if rule not in readme:
              readme = readme.replace(
                  '- `platform-backend/app/main.py` 仅负责 Router 与 Middleware 装配，不得通过运行时赋值修改领域模块。\n',
                  '- `platform-backend/app/main.py` 仅负责 Router 与 Middleware 装配，不得通过运行时赋值修改领域模块。\n' + rule,
                  1,
              )
          readme_path.write_text(readme, encoding='utf-8')

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text(encoding='utf-8')
          rule = '- Keep API schemas owned by their domain module; cross-domain compatibility modules may re-export but must not redefine them.\n'
          if rule not in agents:
              agents = agents.replace(
                  '- Keep one authoritative implementation for each domain calculation; compatibility wiring must not replace functions at runtime.\n',
                  '- Keep one authoritative implementation for each domain calculation; compatibility wiring must not replace functions at runtime.\n' + rule,
                  1,
              )
          agents_path.write_text(agents, encoding='utf-8')

          architecture_path = root / 'docs/architecture/README.md'
          architecture = architecture_path.read_text(encoding='utf-8')
          section = dedent(
              '''

              ## Domain Schema 边界

              - 执行、订单、批次、策略运行、持仓和 PnL API DTO 由 `platform-backend/app/execution_schemas.py` 统一维护。
              - `platform-backend/app/schemas.py` 作为迁移期兼容入口，只允许重导出，不得重复定义执行域类型。
              - `tests/test_schema_boundaries.py` 校验兼容导出的对象身份和单一所有权。
              '''
          )
          if '## Domain Schema 边界' not in architecture:
              architecture = architecture.rstrip() + section + '\n'
          architecture_path.write_text(architecture, encoding='utf-8')
          PY
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Format and validate backend
        working-directory: platform-backend
        run: |
          python -m ruff check app/schemas.py app/execution_schemas.py tests/test_schema_boundaries.py --fix
          python -m ruff format app/schemas.py app/execution_schemas.py tests/test_schema_boundaries.py
          python -m ruff check app tests
          python -m pip check
          python -m pytest
      - name: Commit validated extraction
        shell: bash
        run: |
          rm .github/workflows/apply-phase1-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend README.md AGENTS.md docs/architecture/README.md
          git add -u .github/workflows/apply-phase1-capture.yml
          git commit -m 'refactor: move execution schemas behind a domain boundary'
          git push origin HEAD:hardening/phase3-execution-schema-boundary
