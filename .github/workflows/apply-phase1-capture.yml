name: Capture Phase 1 Composition Refactor

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate code and capture validation
        shell: bash
        run: |
          set +e
          mkdir -p debug
          {
            echo '=== load script ==='
            git fetch origin refactor/phase1-composition-boundaries
            git show origin/refactor/phase1-composition-boundaries:scripts/apply_phase1_composition_refactor.py > scripts/apply_phase1_composition_refactor.py
            echo '=== apply script ==='
            python scripts/apply_phase1_composition_refactor.py
            apply_status=$?
            echo "apply_status=$apply_status"
            echo '=== correct generated EOD indentation ==='
            python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/eod_reconciliation.py')
          source = path.read_text(encoding='utf-8')
          malformed = '''\
          apply_outstanding_difference_gate(
              report_id,
              request.strategy_instance_id,
              request.account_id,
          )
          return get_eod_report(report_id)
          '''
          corrected = '''\
              apply_outstanding_difference_gate(
                  report_id,
                  request.strategy_instance_id,
                  request.account_id,
              )
              return get_eod_report(report_id)
          '''
          if malformed in source:
              source = source.replace(malformed, corrected, 1)
              path.write_text(source, encoding='utf-8')
              print('corrected')
          else:
              print('malformed block not present')
          PY
            echo '=== install backend ==='
            cd platform-backend
            python -m pip install -e '.[dev]'
            install_status=$?
            echo "install_status=$install_status"
            echo '=== format ==='
            python -m ruff format app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py tests/test_architecture_boundaries.py
            format_status=$?
            echo "format_status=$format_status"
            echo '=== lint ==='
            python -m ruff check app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py app/execution_exposure.py tests/test_architecture_boundaries.py
            lint_status=$?
            echo "lint_status=$lint_status"
            echo '=== tests ==='
            python -m pytest
            test_status=$?
            echo "test_status=$test_status"
            cd ..
          } > debug/phase1-composition-refactor.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend README.md AGENTS.md docs/architecture/README.md debug/phase1-composition-refactor.log
          git commit -m 'refactor: materialize composition boundary changes with diagnostics' || true
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
