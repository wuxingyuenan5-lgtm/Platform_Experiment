name: Capture Phase 1 Composition Refactor

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - name: Restore EOD compatibility port without duplicate implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/eod_reconciliation.py')
          source = path.read_text(encoding='utf-8')
          type_anchor = 'ReportStatus = Literal[\n'
          alias = (
              '# Stable orchestration port backed by the single policy implementation.\n'
              'list_strategy_orders = list_strategy_orders_for_eod\n\n'
          )
          if alias not in source:
              if type_anchor not in source:
                  raise RuntimeError('EOD type anchor not found')
              source = source.replace(type_anchor, alias + type_anchor, 1)
          source = source.replace(
              'for order_id in list_strategy_orders_for_eod(\n',
              'for order_id in list_strategy_orders(\n',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/apply-phase1-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/eod_reconciliation.py
          git add -u .github/workflows/apply-phase1-capture.yml
          git commit -m 'fix: preserve the EOD orchestration compatibility port'
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
