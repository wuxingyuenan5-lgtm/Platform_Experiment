name: Normalize Active Frontend Lint Surface

on:
  push:
    branches:
      - hardening/phase2-ci-coverage-and-structure
    paths:
      - '.github/workflows/apply-phase1-capture.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase2-ci-coverage-and-structure
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: admin-risk
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic ESLint and Prettier fixes
        working-directory: admin-risk
        shell: bash
        run: |
          pnpm exec eslint --fix \
            "src/api/platform/**/*.{ts,tsx}" \
            "src/hooks/trading/**/*.{ts,tsx}" \
            "src/views/strategy/funding-carry/**/*.{vue,ts,tsx}"
          pnpm type:check
          pnpm build
      - name: Commit normalized frontend sources
        shell: bash
        run: |
          rm .github/workflows/apply-phase1-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/src/api/platform admin-risk/src/hooks/trading admin-risk/src/views/strategy/funding-carry
          git add -u .github/workflows/apply-phase1-capture.yml
          git commit -m 'style: normalize active frontend lint surface'
          git push origin HEAD:hardening/phase2-ci-coverage-and-structure
