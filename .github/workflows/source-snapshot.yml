name: One-time Integration Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: integration-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded backend patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/integration-repair.patch
          git apply .github/integration-repair.patch
          python -m compileall -q platform-backend/app platform-backend/tests
          git diff --check
      - name: Commit repair and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/integration-repair.patch
          rm .github/workflows/source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-backend .github
          git commit -m "fix: resolve backend integration diagnostics"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
