name: Temporary Issue 125 Formatter

on:
  push:
    branches:
      - feature/issue-125-hedge-board-research-upgrade

permissions:
  contents: write

concurrency:
  group: temporary-issue-125-formatter
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(format):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-125-hedge-board-research-upgrade
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: admin-risk
        run: pnpm install --frozen-lockfile
      - name: Format bounded Issue 125 frontend files
        working-directory: admin-risk
        run: |
          pnpm exec prettier --write \
            src/api/hedgeResearch.ts \
            src/router/routes/modules/hedge.ts \
            src/views/hedgeBoard/aShare/**/*.ts \
            src/views/hedgeBoard/aShare/**/*.vue \
            src/views/hedgeBoard/macro/**/*.vue \
            src/views/hedgeBoard/research/**/*.vue
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-risk/src/api/hedgeResearch.ts \
            admin-risk/src/router/routes/modules/hedge.ts \
            admin-risk/src/views/hedgeBoard/aShare \
            admin-risk/src/views/hedgeBoard/macro \
            admin-risk/src/views/hedgeBoard/research
          git commit -m "chore(format): apply Issue 125 frontend style"
          git push origin HEAD:feature/issue-125-hedge-board-research-upgrade
