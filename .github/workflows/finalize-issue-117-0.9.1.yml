name: Finalize Issue 117 platform 0.9.1

on:
  push:
    branches:
      - feature/issue-117-platform-0.9.1
    paths:
      - .github/workflows/finalize-issue-117-0.9.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-117-platform-0.9.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply backend formatting and update branch references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python -m pip install -e './platform-backend[dev]'
          cd platform-backend
          python -m ruff check app tests --fix
          cd ..

          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_names = (
              'release/0.9.1-user-system',
              'release/issue-117-0.9.1-user-system',
          )
          new = 'feature/issue-117-platform-0.9.1'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for item in tracked:
              if not item or Path(item).suffix.lower() not in {'.md', '.txt'}:
                  continue
              path = Path(item)
              content = path.read_text(encoding='utf-8-sig')
              updated = content
              for old in old_names:
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
          PY

          git rm .github/workflows/finalize-issue-117-0.9.1.yml
          git add --all
          git commit -m "fix: finalize governed 0.9.1 integration branch"
          git push origin HEAD:feature/issue-117-platform-0.9.1
