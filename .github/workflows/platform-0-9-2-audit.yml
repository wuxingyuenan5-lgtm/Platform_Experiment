name: Platform 0.9.2 Baseline Audit

on:
  push:
    branches:
      - refactor/issue-136-platform-0.9.2-system-optimization
    paths:
      - '.github/workflows/platform-0-9-2-audit.yml'
      - 'scripts/audit-platform-baseline.py'
      - 'scripts/run-platform-baseline-audit.py'
      - 'tasks/issue-136-platform-0-9-2-system-optimization.md'
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/platform-0-9-2-audit.yml'
      - 'scripts/audit-platform-baseline.py'
      - 'scripts/run-platform-baseline-audit.py'
      - 'tasks/issue-136-platform-0-9-2-system-optimization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-0-9-2-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate collector syntax
        run: |
          python -m py_compile scripts/audit-platform-baseline.py
          python -m py_compile scripts/run-platform-baseline-audit.py

      - name: Collect repository baseline
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-0-9-2-audit
          PLATFORM_AUDIT_BASE: feature/issue-134-platform-0-9-1-unified-delivery@8114fce45e46e7920f316f49d03db12dc424acf1
        run: |
          python scripts/run-platform-baseline-audit.py
          cat "${PLATFORM_AUDIT_OUTPUT}/platform-0.9.2-baseline-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive tracked source for evidence review
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-0-9-2-audit
        run: |
          git archive --format=tar.gz --output="${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.tar.gz" HEAD
          git rev-parse HEAD > "${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.sha"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-0-9-2-baseline-audit-${{ github.sha }}
          path: ${{ runner.temp }}/platform-0-9-2-audit/
          if-no-files-found: error
          retention-days: 30
