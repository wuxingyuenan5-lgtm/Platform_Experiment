name: Platform Baseline Audit

on:
  push:
    branches:
      - refactor/issue-136-platform-0-9-2-system-optimization
      - refactor/platform-0-9-3-repository-and-context-optimization
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/platform-0-9-2-audit.yml'
      - 'scripts/audit-platform-baseline.py'
      - 'scripts/run-platform-baseline-audit.py'
      - 'scripts/context-for.py'
      - 'scripts/check-codex-context.py'
      - 'docs/codex/context-map.md'
      - 'tasks/issue-136-platform-0-9-2-system-optimization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-baseline-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate audit and context tools
        run: |
          python -m py_compile scripts/audit-platform-baseline.py
          python -m py_compile scripts/run-platform-baseline-audit.py
          python -m py_compile scripts/context-for.py
          python scripts/check-codex-context.py

      - name: Collect repository baseline
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
          PLATFORM_AUDIT_BASE: feature/issue-134-platform-0-9-1-unified-delivery@8114fce45e46e7920f316f49d03db12dc424acf1
        run: |
          python scripts/run-platform-baseline-audit.py
          mv "${PLATFORM_AUDIT_OUTPUT}/platform-0.9.2-baseline-audit.md" "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.md"
          mv "${PLATFORM_AUDIT_OUTPUT}/platform-0.9.2-baseline-audit.json" "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.json"
          cat "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect bounded context-pack costs
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
        shell: bash
        run: |
          mkdir -p "${PLATFORM_AUDIT_OUTPUT}/context-packs"
          python scripts/context-for.py --list > "${PLATFORM_AUDIT_OUTPUT}/context-packs/index.txt"
          for pack in hedge-style research-field identity-permission member-contract trading-display research-provider user-e2e; do
            python scripts/context-for.py "$pack" --json > "${PLATFORM_AUDIT_OUTPUT}/context-packs/${pack}.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PLATFORM_AUDIT_OUTPUT"]) / "context-packs"
          lines = [
              "# Bounded context costs",
              "",
              "| Task pack | Files | Lines | Est. tokens |",
              "|---|---:|---:|---:|",
          ]
          for path in sorted(root.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              lines.append(
                  f"| `{data['task']}` | {data['file_count']} | "
                  f"{data['line_count']} | {data['estimated_tokens']} |"
              )
          report = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n" + report)
          PY

      - name: Archive tracked source for evidence review
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
        run: |
          git archive --format=tar.gz --output="${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.tar.gz" HEAD
          git rev-parse HEAD > "${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.sha"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-baseline-audit-${{ github.sha }}
          path: ${{ runner.temp }}/platform-baseline-audit/
          if-no-files-found: error
          retention-days: 30
