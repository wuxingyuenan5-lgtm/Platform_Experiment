name: Platform Baseline Audit

on:
  push:
    branches:
      - refactor/issue-136-platform-0-9-2-system-optimization
      - refactor/platform-0-9-3-repository-and-context-optimization
      - refactor/platform-0-9-3-codebase-and-build-simplification
  pull_request:
    branches:
      - refactor/platform-0-9-3-repository-and-context-optimization
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/platform-0-9-2-audit.yml'
      - 'scripts/audit-platform-baseline.py'
      - 'scripts/run-platform-baseline-audit.py'
      - 'scripts/context-for.py'
      - 'scripts/check-codex-context.py'
      - 'docs/codex/context-map.md'
      - 'tasks/issue-136-platform-0-9-2-system-optimization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-baseline-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate audit and context tools
        run: |
          python -m py_compile scripts/audit-platform-baseline.py
          python -m py_compile scripts/run-platform-baseline-audit.py
          python -m py_compile scripts/context-for.py
          python scripts/check-codex-context.py

      - name: Collect repository baseline
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
          PLATFORM_AUDIT_BASE: feature/issue-134-platform-0-9-1-unified-delivery@8114fce45e46e7920f316f49d03db12dc424acf1
        run: |
          python scripts/run-platform-baseline-audit.py
          mv "${PLATFORM_AUDIT_OUTPUT}/platform-0.9.2-baseline-audit.md" "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.md"
          mv "${PLATFORM_AUDIT_OUTPUT}/platform-0.9.2-baseline-audit.json" "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.json"
          cat "${PLATFORM_AUDIT_OUTPUT}/platform-baseline-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect bounded context-pack costs
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
        shell: bash
        run: |
          mkdir -p "${PLATFORM_AUDIT_OUTPUT}/context-packs"
          python scripts/context-for.py --list > "${PLATFORM_AUDIT_OUTPUT}/context-packs/index.txt"
          python scripts/context-for.py --check-budgets --json > "${PLATFORM_AUDIT_OUTPUT}/context-packs/budgets.json"
          for pack in hedge-style research-field identity-permission member-contract trading-display research-provider user-e2e; do
            python scripts/context-for.py "$pack" --json > "${PLATFORM_AUDIT_OUTPUT}/context-packs/${pack}.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PLATFORM_AUDIT_OUTPUT"]) / "context-packs"
          lines = [
              "# Bounded context costs",
              "",
              "| Task pack | Files | Lines | Est. tokens |",
              "|---|---:|---:|---:|",
          ]
          for path in sorted(root.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if "task" not in data:
                  continue
              lines.append(
                  f"| `{data['task']}` | {data['file_count']} | "
                  f"{data['line_count']} | {data['estimated_tokens']} |"
              )
          report = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n" + report)
          PY

      - name: Archive tracked source for evidence review
        env:
          PLATFORM_AUDIT_OUTPUT: ${{ runner.temp }}/platform-baseline-audit
        run: |
          git archive --format=tar.gz --output="${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.tar.gz" HEAD
          git rev-parse HEAD > "${PLATFORM_AUDIT_OUTPUT}/platform-source-snapshot.sha"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-baseline-audit-${{ github.sha }}
          path: ${{ runner.temp }}/platform-baseline-audit/
          if-no-files-found: error
          retention-days: 30


  candidate-run-evidence:
    name: Candidate workflow evidence
    if: >-
      ${{ always() && github.event_name == 'push' &&
          github.ref_name == 'refactor/platform-0-9-3-repository-and-context-optimization' ||
          github.ref_name == 'refactor/platform-0-9-3-codebase-and-build-simplification' }}
    needs: repository-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: write

    steps:
      - name: Collect final-head workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/platform-0-9-3-ci-evidence
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          mkdir -p "${EVIDENCE_OUTPUT}"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["TARGET_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          current_run_id = int(os.environ["TARGET_RUN_ID"])
          output = Path(os.environ["EVIDENCE_OUTPUT"])
          token = os.environ["GH_TOKEN"]
          api_root = "https://api.github.com"
          workflow_names = (
              "Platform CI",
              "Platform Directory Invariants",
              "Version Consistency",
              "Secret Scan",
              "Platform Baseline Audit",
              "Platform Visual Baseline",
              "User System Browser E2E",
              "Hedge Board Browser E2E",
              "Research Provider Smoke",
          )

          def request(path: str, *, method: str = "GET", payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api_root}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "platform-0.9.3-phase-1a-evidence",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          selected: dict[str, dict] = {}
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              payload = request(
                  f"/repos/{repository}/actions/runs?head_sha={sha}&event=push&per_page=100"
              )
              candidates = payload.get("workflow_runs", [])
              selected = {
                  run["name"]: run
                  for run in candidates
                  if run.get("name") in workflow_names
              }
              missing = [name for name in workflow_names if name not in selected]
              incomplete = [
                  name
                  for name, run in selected.items()
                  if int(run["id"]) != current_run_id and run.get("status") != "completed"
              ]
              if not missing and not incomplete:
                  break
              time.sleep(15)
          else:
              raise SystemExit(
                  "Timed out waiting for candidate runs: "
                  f"missing={missing}, incomplete={incomplete}"
              )

          evidence = []
          for name in workflow_names:
              run = selected[name]
              run_id = int(run["id"])
              jobs_payload = request(f"/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100")
              artifact_payload = request(
                  f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100"
              )
              jobs = [
                  {
                      "id": job["id"],
                      "name": job["name"],
                      "status": job["status"],
                      "conclusion": job["conclusion"],
                  }
                  for job in jobs_payload.get("jobs", [])
              ]
              artifacts = [
                  {
                      "id": artifact["id"],
                      "name": artifact["name"],
                      "expired": artifact["expired"],
                  }
                  for artifact in artifact_payload.get("artifacts", [])
              ]
              evidence.append(
                  {
                      "workflow": name,
                      "run_id": run_id,
                      "event": run["event"],
                      "head_sha": run["head_sha"],
                      "status": run["status"],
                      "conclusion": run["conclusion"],
                      "url": run["html_url"],
                      "jobs": jobs,
                      "artifacts": artifacts,
                  }
              )

          evidence_path = output / "candidate-workflow-runs.json"
          evidence_path.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = [
              "## Platform 0.9.3 Phase 1A candidate CI evidence",
              "",
              f"Final head: `{sha}`",
              "",
              "The Baseline Audit run remains `in_progress` while this evidence job posts; "
              "its final conclusion is verified after the run completes.",
              "",
              "| Workflow | Run ID | Event | Status | Conclusion | Jobs | Artifacts |",
              "|---|---:|---|---|---|---|---|",
          ]
          for item in evidence:
              job_text = "; ".join(
                  f"{job['name']}={job['conclusion'] or job['status']}" for job in item["jobs"]
              ) or "none"
              artifact_text = "; ".join(
                  f"{artifact['name']} ({artifact['id']})" for artifact in item["artifacts"]
              ) or "none"
              lines.append(
                  f"| [{item['workflow']}]({item['url']}) | {item['run_id']} | "
                  f"{item['event']} | {item['status']} | {item['conclusion'] or 'pending'} | "
                  f"{job_text} | {artifact_text} |"
              )
          body = "\n".join(lines) + "\n"
          (output / "candidate-workflow-runs.md").write_text(body, encoding="utf-8")
          print(body)

          for item in evidence:
              conclusion = item["conclusion"]
              if conclusion == "success":
                  state = "success"
              elif conclusion in {"failure", "cancelled", "timed_out", "action_required"}:
                  state = "failure"
              elif conclusion in {"neutral", "skipped", "stale"}:
                  state = "error"
              else:
                  state = "pending"
              context = "phase-1a/" + item["workflow"].lower().replace(" ", "-")
              request(
                  f"/repos/{repository}/statuses/{sha}",
                  method="POST",
                  payload={
                      "state": state,
                      "target_url": item["url"],
                      "description": (
                          f"run {item['run_id']}: "
                          f"{item['status']}/{conclusion or 'pending'}"
                      ),
                      "context": context,
                  },
              )

          PY

      - name: Upload candidate workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-0-9-3-ci-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/platform-0-9-3-ci-evidence/
          if-no-files-found: error
          retention-days: 30
