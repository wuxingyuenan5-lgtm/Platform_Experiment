name: Apply Phase 1 Composition Refactor Once

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/apply-phase1-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load deterministic refactor script
        shell: bash
        run: |
          git fetch origin refactor/phase1-composition-boundaries
          git show origin/refactor/phase1-composition-boundaries:scripts/apply_phase1_composition_refactor.py > scripts/apply_phase1_composition_refactor.py
      - name: Apply deterministic source changes
        run: |
          python scripts/apply_phase1_composition_refactor.py
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/eod_reconciliation.py')
          source = path.read_text(encoding='utf-8')
          malformed = '''\
          apply_outstanding_difference_gate(
              report_id,
              request.strategy_instance_id,
              request.account_id,
          )
          return get_eod_report(report_id)
          '''
          corrected = '''\
              apply_outstanding_difference_gate(
                  report_id,
                  request.strategy_instance_id,
                  request.account_id,
              )
              return get_eod_report(report_id)
          '''
          if malformed not in source:
              raise RuntimeError('Generated EOD policy block was not found')
          path.write_text(source.replace(malformed, corrected, 1), encoding='utf-8')
          PY
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Format and validate backend
        working-directory: platform-backend
        run: |
          python -m ruff format app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py tests/test_architecture_boundaries.py
          python -m ruff check app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py app/execution_exposure.py tests/test_architecture_boundaries.py
          python -m pytest
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend README.md AGENTS.md docs/architecture/README.md
          git diff --cached --quiet && exit 1
          git commit -m 'refactor: make backend composition dependencies explicit'
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
