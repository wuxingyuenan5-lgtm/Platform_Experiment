name: Temporary Fix User E2E Dialog

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-user-e2e-dialog.yml'

permissions:
  contents: write

jobs:
  fix-e2e-dialog:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact dialog and timeout fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('admin-risk/e2e/user-system/user-system.spec.ts')
          source = spec.read_text(encoding='utf-8')
          old = "page.getByRole('dialog').getByRole('button', { name: /确.*定/ }).click();"
          new = "page.getByRole('dialog').getByRole('button', { name: /确\\s*认/ }).click();"
          if source.count(old) != 1:
              raise SystemExit('Expected pending-dialog locator was not found exactly once')
          spec.write_text(source.replace(old, new), encoding='utf-8')

          config = Path('admin-risk/playwright.user-system.config.ts')
          config_source = config.read_text(encoding='utf-8')
          marker = "    ...devices['Desktop Chrome'],\n"
          replacement = marker + "    actionTimeout: 15_000,\n"
          if config_source.count(marker) != 1 or 'actionTimeout: 15_000' in config_source:
              raise SystemExit('Expected Playwright use marker was not found exactly once')
          config.write_text(config_source.replace(marker, replacement), encoding='utf-8')
          PY
          git diff --check
      - name: Commit dialog and timeout fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/e2e/user-system/user-system.spec.ts admin-risk/playwright.user-system.config.ts
          git commit -m 'test(user-system): fix dialog locator and action timeout'
          git push
