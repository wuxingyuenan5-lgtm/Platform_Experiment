name: Debug Production Operations Failure Summary

on:
  push:
    branches:
      - hardening/v6-production-gate-observability-backup-restore
    paths:
      - '.github/workflows/debug-production-ops-summary.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v6-production-gate-observability-backup-restore
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Commit first failure in message
        shell: bash
        run: |
          set +e
          cd platform-backend
          python -m pytest tests/test_disaster_recovery.py tests/test_production_monitoring.py -vv > /tmp/production-ops-summary.log 2>&1
          status=$?
          cd ..
          failed=$(grep -m1 -E '^FAILED ' /tmp/production-ops-summary.log | tr '\n' ' ' | tr -cd '[:alnum:] _./:=-' | cut -c1-150)
          error=$(grep -m1 -E '^E   ' /tmp/production-ops-summary.log | tr '\n' ' ' | tr -cd '[:alnum:] _./:=-' | cut -c1-150)
          summary="status-$status ${failed:-no-failed-line} ${error:-no-error-line}"
          mkdir -p debug
          printf '%s\n' "$summary" > debug/production-ops-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/production-ops-summary.txt
          git commit -m "debug: $summary" || true
          git push origin HEAD:hardening/v6-production-gate-observability-backup-restore
