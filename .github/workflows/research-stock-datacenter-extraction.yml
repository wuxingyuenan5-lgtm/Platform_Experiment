name: Research Stock DataCenter Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/research-stock-datacenter-extraction.yml
      - scripts/apply-research-stock-datacenter-extraction.py
      - platform-api/app/research_provider_stock_datacenter.py
      - platform-api/tests/test_research_provider_stock_datacenter.py

permissions:
  contents: write

concurrency:
  group: research-stock-datacenter-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml

      - name: Install Platform API development dependencies
        run: python -m pip install -e 'platform-api[dev]'

      - name: Apply mechanical extraction
        run: python scripts/apply-research-stock-datacenter-extraction.py

      - name: Validate extraction
        run: |
          python -m ruff check \
            platform-api/app/research_provider_stock_datacenter.py \
            platform-api/app/research_providers.py \
            platform-api/tests/test_research_provider_stock_datacenter.py
          cd platform-api
          python -m pyright
          python -m pytest \
            tests/test_research_provider_stock_datacenter.py \
            tests/test_research_provider_datacenter.py \
            tests/test_research_provider_a_share.py \
            tests/test_research_provider_macro.py \
            tests/test_research_provider_normalization.py \
            tests/test_research_service.py \
            tests/test_a_share_research_policy.py \
            -q
          cd ..
          git diff --check

      - name: Push stock DataCenter extraction commit
        run: |
          if git diff --quiet -- platform-api/app/research_providers.py platform-api/pyproject.toml; then
            echo 'Stock DataCenter extraction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-api/app/research_providers.py platform-api/pyproject.toml
          git commit -m 'refactor: delegate stock DataCenter provider'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
