name: One-time User System Status Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: user-system-status-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize verified status
        run: |
          python .github/user-system-status-sync.py
          git diff --check
      - name: Validate synchronized documents
        run: |
          python scripts/check-documentation-consistency.py
          python scripts/check-repository-structure.py
          python scripts/check-version-consistency.py
      - name: Commit verified status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tasks
          git -c core.hooksPath=/dev/null commit -m "docs: record user-system automated verification"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
