name: Capture Phase 1 Ruff Fix

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/fix-phase1-ruff-capture.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - name: Apply line-based EOD fix and commit result
        shell: bash
        run: |
          set +e
          mkdir -p outputs
          python - <<'PY' > outputs/phase1-ruff-fix.txt 2>&1
          from pathlib import Path

          path = Path('platform-backend/app/eod_reconciliation.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = []
          for index in range(len(lines) - 3):
              if (
                  lines[index].strip() == 'row = db.execute('
                  and 'SELECT * FROM eod_reconciliation_reports WHERE id = ?' in lines[index + 1]
                  and lines[index + 2].strip() == '(report_id,),'
                  and lines[index + 3].strip() == ').fetchone()'
              ):
                  matches.append(index)
          print(f'matches={matches}')
          if len(matches) == 1:
              index = matches[0]
              del lines[index:index + 4]
              path.write_text(''.join(lines), encoding='utf-8')
              print('removed=true')
          else:
              print('removed=false')
          PY
          rm -f \
            .github/workflows/fix-phase1-ruff-once.yml \
            .github/workflows/fix-phase1-ruff-exact-once.yml \
            .github/workflows/fix-phase1-ruff-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/eod_reconciliation.py outputs/phase1-ruff-fix.txt
          git add -u .github/workflows
          git commit -m 'fix: remove redundant EOD report query with diagnostics' || true
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
