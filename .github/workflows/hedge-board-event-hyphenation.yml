name: Hedge Board Event Hyphenation

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/hedge-board-event-hyphenation.yml
      - scripts/apply-hedge-board-event-hyphenation.py

permissions:
  contents: write

concurrency:
  group: hedge-board-event-hyphenation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - name: Apply event hyphenation
        run: python scripts/apply-hedge-board-event-hyphenation.py

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Validate normalized event
        run: |
          cd platform-web
          pnpm exec prettier --check src/views/hedgeBoard/index.vue
          python ../scripts/frontend-no-new-debt.py
          pnpm type:check
          cd ..
          git diff --check

      - name: Push validated normalization
        run: |
          if git diff --quiet -- platform-web/src/views/hedgeBoard/index.vue; then
            echo 'Hedge Board event hyphenation is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-web/src/views/hedgeBoard/index.vue
          git commit -m 'style: normalize hedge board update event'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
