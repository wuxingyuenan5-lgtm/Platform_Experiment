name: Hedge Board Browser E2E

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/platform-0-9-3-repository-and-context-optimization
      - refactor/platform-0-9-3-codebase-and-build-simplification
  pull_request:
    branches:
      - main
      - refactor/platform-0-9-3-repository-and-context-optimization
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/hedge-board-e2e.yml'
      - 'platform-web/.env.development'
      - 'platform-web/.env.production'
      - 'platform-web/package.json'
      - 'platform-web/pnpm-lock.yaml'
      - 'platform-web/playwright.hedge-board.config.ts'
      - 'platform-web/e2e/hedge-board/**'
      - 'platform-web/scripts/verify-hedge-board-layout.cjs'
      - 'platform-web/src/api/hedgeResearch.ts'
      - 'platform-web/src/api/platform/researchWatchlist.ts'
      - 'platform-web/src/api/platform/userSystem.ts'
      - 'platform-web/src/router/routes/modules/hedge.ts'
      - 'platform-web/src/store/modules/user.ts'
      - 'platform-web/src/views/hedgeBoard/**'
      - 'docs/operations/HEDGE_BOARD_ACCEPTANCE.md'
      - 'docs/operations/PLATFORM_0_9_1_LOCAL_ACCEPTANCE_HANDOFF.md'
      - 'platform-api/app/auth.py'
      - 'platform-api/app/config.py'
      - 'platform-api/app/main.py'
      - 'platform-api/app/research_*.py'
      - 'platform-api/app/schema_migrations.py'
      - 'platform-api/app/user_*.py'
      - 'platform-api/scripts/seed_hedge_board_e2e.py'
      - 'platform-api/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: hedge-board-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml

      - name: Install Platform API
        run: python -m pip install -e './platform-api[dev]'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: platform-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate isolated employee credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('E2E_CEO_USERNAME=e2e_employee_1\n')
              output.write(f"E2E_CEO_PASSWORD=Cc9!{secrets.token_urlsafe(24)}\n")
          PY

      - name: Run hedge-board browser acceptance
        working-directory: platform-web
        run: pnpm test:e2e:hedge-board

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hedge-board-browser-e2e
          path: |
            platform-web/playwright-report/hedge-board
            platform-web/test-results/hedge-board
          if-no-files-found: warn
          retention-days: 3
