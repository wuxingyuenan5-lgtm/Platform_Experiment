name: Temporary Lock Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-add-playwright.yml'

permissions:
  contents: write

jobs:
  lock-playwright:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Add and lock Playwright
        id: add_playwright
        continue-on-error: true
        working-directory: admin-risk
        env:
          HUSKY: '0'
        shell: bash
        run: |
          set -o pipefail
          pnpm add --save-dev @playwright/test --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/playwright-lock.log"
      - name: Upload lock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lock-diagnostics
          path: ${{ runner.temp }}/playwright-lock.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit dependency lock
        if: steps.add_playwright.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/package.json admin-risk/pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'test(user-system): lock Playwright dependency'
          git push
      - name: Enforce dependency lock
        if: always()
        run: test "${{ steps.add_playwright.outcome }}" = 'success'
