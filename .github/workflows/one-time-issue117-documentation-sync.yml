name: One-time User System Documentation Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue117-documentation-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply documentation sync
        run: python scripts/apply-issue117-documentation-sync.py
      - name: Validate synchronized Markdown
        run: |
          python scripts/check-documentation-consistency.py
          python scripts/check-version-consistency.py
          git diff --check
      - name: Commit synchronized Markdown
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/planning/V6-Production-Gate-监控备份恢复.md \
            docs/technical/AUTH_RBAC_LIVE_SESSIONS.md
          git -c core.hooksPath=/dev/null commit -m "docs: synchronize user-system recovery evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
