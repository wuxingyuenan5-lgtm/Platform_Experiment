name: Temporary Issue 125 Event Fixer

on:
  push:
    branches:
      - feature/issue-125-hedge-board-research-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-issue-125-event-fixer
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(frontend): hyphenate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-125-hedge-board-research-upgrade
          fetch-depth: 0
      - name: Hyphenate Vue event listener
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin-risk/src/views/hedgeBoard/aShare/index.vue')
          text = path.read_text(encoding='utf-8')
          old = '@update:modelValue="navigateMarket"'
          new = '@update:model-value="navigateMarket"'
          if old not in text:
              raise SystemExit('expected listener not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit bounded fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-risk/src/views/hedgeBoard/aShare/index.vue
          git commit -m "chore(frontend): hyphenate Issue 125 event listener"
          git push origin HEAD:feature/issue-125-hedge-board-research-upgrade
