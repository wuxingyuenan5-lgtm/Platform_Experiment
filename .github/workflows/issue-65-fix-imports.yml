name: Issue 65 Import Fix

on:
  push:
    branches:
      - refactor/issue-65-venue-reconciliation-schemas

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-65-venue-reconciliation-schemas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply import grouping fix
        run: python scripts/issue-65-fix-imports.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Venue Reconciliation import grouping"
          git push origin HEAD:refactor/issue-65-venue-reconciliation-schemas
