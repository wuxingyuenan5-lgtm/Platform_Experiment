name: Acceptance Credential Wording Fix

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/acceptance-password-wording-fix.yml
      - scripts/apply-acceptance-password-wording-fix.py

permissions:
  contents: write

concurrency:
  group: acceptance-password-wording-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact wording fix
        run: python scripts/apply-acceptance-password-wording-fix.py

      - name: Validate Secret Scan and documentation
        run: |
          python scripts/scan-secrets.py
          python scripts/check-documentation-consistency.py
          git diff --check

      - name: Push validated fix
        run: |
          if git diff --quiet -- docs/operations/PLATFORM_0_9_1_LOCAL_ACCEPTANCE_HANDOFF.md; then
            echo 'Acceptance credential wording is already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/PLATFORM_0_9_1_LOCAL_ACCEPTANCE_HANDOFF.md
          git commit -m 'docs: avoid password-like acceptance labels'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
