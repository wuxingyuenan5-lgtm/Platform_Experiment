name: Temporary Fix User E2E URL

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-user-e2e-url.yml'

permissions:
  contents: write

jobs:
  fix-e2e-url:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact URL boundary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-risk/e2e/user-system/user-system.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = '''function absoluteUrl(path: string): string {
            return new URL(path, FRONTEND_ORIGIN).toString();
          }'''.replace('          ', '')
          new = '''function absoluteUrl(path: string): string {
            if (!path.startsWith('/api/')) return `${FRONTEND_ORIGIN}/#${path}`;
            return new URL(path, FRONTEND_ORIGIN).toString();
          }'''.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit('Expected URL helper was not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit URL boundary fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/e2e/user-system/user-system.spec.ts
          git commit -m 'test(user-system): use hash routes in browser e2e'
          git push
