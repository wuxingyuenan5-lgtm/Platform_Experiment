name: Temporary Fix User E2E Member Tab

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-fix-user-e2e-member-tab.yml'

permissions:
  contents: write

jobs:
  fix-member-tab:
    if: github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Insert exact member profile-tab transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-risk/e2e/user-system/user-system.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = "      await expect(sameSessionTab.getByText('个人账号', { exact: true }).first()).toBeVisible();\n\n      const displayNameInput = primaryPage\n"
          new = "      await expect(sameSessionTab.getByText('个人账号', { exact: true }).first()).toBeVisible();\n\n      await expect(primaryPage.getByRole('tab', { name: '基金持仓' })).toHaveAttribute(\n        'aria-selected',\n        'true',\n      );\n      await primaryPage.getByRole('tab', { name: '资料与安全' }).click();\n\n      const displayNameInput = primaryPage\n"
          if source.count(old) != 1:
              raise SystemExit('Expected member tab transition point was not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit member-tab fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-risk/e2e/user-system/user-system.spec.ts
          git commit -m 'test(user-system): switch member to profile tab before editing'
          git push
