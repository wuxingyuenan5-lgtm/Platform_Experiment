name: Phase 3 Codegen PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase3-codegen.yml'
      - '.github/workflows/phase3-codegen-pr.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase3-codegen.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Install backend dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply_phase3.py').write_text(script + '\n', encoding='utf-8')
          PY
          python /tmp/apply_phase3.py
      - name: Install backend dependencies
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Validate backend
        working-directory: platform-backend
        run: |
          python -m ruff check app tests
          python -m pytest
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-codegen.yml .github/workflows/phase3-codegen-pr.yml
          git add .
          git commit -m "feat: add immutable financial facts and formal accounting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
