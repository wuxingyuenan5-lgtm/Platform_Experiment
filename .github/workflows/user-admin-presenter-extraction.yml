name: User Admin Presenter Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/user-admin-presenter-extraction.yml
      - platform-api/app/user_admin_presenter.py
      - platform-api/tests/test_user_admin_presenter.py
      - platform-api/tests/test_architecture_user_admin_presenter.py

permissions:
  contents: write

concurrency:
  group: user-admin-presenter-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Platform API dependencies
        working-directory: platform-api
        run: python -m pip install -e '.[dev]'

      - name: Apply presenter delegation
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('platform-api/app/user_admin_service.py')
          pyproject_path = Path('platform-api/pyproject.toml')
          service = service_path.read_text(encoding='utf-8')
          pyproject = pyproject_path.read_text(encoding='utf-8')
          presenter_import = '''from app.user_admin_presenter import (
              admin_audit_response as _audit_response,
              admin_user_detail as _detail,
              admin_user_summary as _summary,
          )
          '''
          marker = 'from app.user_admin_policy import (\n'
          if presenter_import not in service:
              service = service.replace(marker, presenter_import + marker, 1)
          start_marker = 'def _mask_email(value: str | None) -> str | None:\n'
          end_marker = 'def _current_session('
          if start_marker in service:
              start = service.index(start_marker)
              end = service.index(end_marker, start)
              service = service[:start] + service[end:]
          for line in (
              'from typing import cast\n',
              '    AdminAuditRecord,\n',
              '    AdminUserRecord,\n',
              '    RegularHumanRole,\n',
              '    UserAdminSummaryResponse,\n',
              '    UserAuditEventResponse,\n',
              'from app.user_permissions import permissions_for_roles\n',
              'from app.user_schemas import HumanRole, UserLifecycleStatus\n',
          ):
              service = service.replace(line, '', 1)
          type_line = '  "app/user_admin_presenter.py",\n'
          type_marker = '  "app/user_admin_policy.py",\n'
          if type_line not in pyproject:
              pyproject = pyproject.replace(type_marker, type_marker + type_line, 1)
          service_path.write_text(service, encoding='utf-8')
          pyproject_path.write_text(pyproject, encoding='utf-8')
          PY

      - name: Validate presenter boundary
        working-directory: platform-api
        run: |
          ruff check \
            app/user_admin_presenter.py \
            app/user_admin_service.py \
            tests/test_user_admin_presenter.py \
            tests/test_architecture_user_admin_presenter.py
          pyright
          pytest -q \
            tests/test_user_admin_presenter.py \
            tests/test_architecture_user_admin_presenter.py \
            tests/test_user_admin.py \
            tests/test_user_target_scope.py \
            tests/test_user_audit_transactions.py \
            tests/test_last_ceo_concurrency.py \
            tests/test_password_reset_tickets.py
          git diff --check

      - name: Push validated commits
        run: |
          if git diff --quiet -- platform-api/app/user_admin_service.py platform-api/pyproject.toml; then
            echo 'User admin presenter delegation is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-api/app/user_admin_service.py
          git commit -m 'refactor: delegate user admin response mapping'
          git add platform-api/pyproject.toml
          git commit -m 'chore: type-check user admin presenter'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
