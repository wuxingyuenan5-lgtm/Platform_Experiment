name: EOD Reconciliation Route Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/eod-reconciliation-route-extraction.yml
      - scripts/apply-eod-reconciliation-route-extraction.py

permissions:
  contents: write

concurrency:
  group: eod-reconciliation-route-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize one-time extraction assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-eod-reconciliation-route-extraction.py')
          source = path.read_text(encoding='utf-8')

          old_assertion = '    assert "app.eod_reconciliation" in imports\n'
          new_assertion = (
              '    assert "app" in imports\n'
              '    assert "from app import eod_reconciliation as facade" in source\n'
          )
          if source.count(old_assertion) != 1:
              raise SystemExit('Expected exactly one one-time AST assertion')
          source = source.replace(old_assertion, new_assertion, 1)

          query_lines = (
              '    strategy_instance_id: str | None = Query(default=None, alias="strategyInstanceId"),\n',
              '    account_id: str | None = Query(default=None, alias="accountId"),\n',
              '    business_date: date | None = Query(default=None, alias="businessDate"),\n',
          )
          for line in query_lines:
              if source.count(line) != 1:
                  raise SystemExit(f'Expected exactly one query declaration: {line!r}')
              source = source.replace(
                  line,
                  line.rstrip('\n') + '  # noqa: B008\n',
                  1,
              )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply EOD route extraction
        run: python scripts/apply-eod-reconciliation-route-extraction.py

      - name: Install Platform API
        run: python -m pip install -e './platform-api[dev]'

      - name: Validate exact EOD boundary
        run: |
          python -m ruff check \
            platform-api/app/eod_reconciliation.py \
            platform-api/app/eod_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_eod_reconciliation_service.py
          cd platform-api
          python -m pyright
          python -m pytest -q \
            tests/test_architecture_eod_reconciliation_service.py \
            tests/test_eod_reconciliation.py \
            tests/test_eod_reconciliation_policy.py
          cd ..
          python scripts/check-documentation-consistency.py
          git diff --check

      - name: Push validated extraction
        run: |
          if git diff --quiet -- \
            platform-api/app/eod_reconciliation.py \
            platform-api/app/eod_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_eod_reconciliation_service.py \
            docs/architecture/OWNERSHIP.md; then
            echo 'EOD route extraction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform-api/app/eod_reconciliation.py \
            platform-api/app/eod_reconciliation_routes.py \
            platform-api/app/main.py \
            platform-api/tests/test_architecture_eod_reconciliation_service.py \
            docs/architecture/OWNERSHIP.md
          git commit -m 'refactor: extract EOD reconciliation routes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
