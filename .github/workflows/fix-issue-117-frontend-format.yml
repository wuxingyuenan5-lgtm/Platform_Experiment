name: Fix Issue 117 frontend formatting

on:
  push:
    branches:
      - feature/issue-117-platform-0-9-1
    paths:
      - .github/workflows/fix-issue-117-frontend-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-117-platform-0-9-1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml

      - name: Format maintained frontend files
        working-directory: admin-risk
        env:
          HUSKY: '0'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/api/platform/crossSpreadObservability.ts \
            src/views/strategy/funding-carry/components/FundingExecutionPanel.vue \
            src/views/strategy/funding-carry/components/FundingOrderPanel.vue \
            src/views/strategy/funding-carry/components/FundingPositionsPanel.vue

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-issue-117-frontend-format.yml
          git add admin-risk/src/api/platform/crossSpreadObservability.ts \
            admin-risk/src/views/strategy/funding-carry/components/FundingExecutionPanel.vue \
            admin-risk/src/views/strategy/funding-carry/components/FundingOrderPanel.vue \
            admin-risk/src/views/strategy/funding-carry/components/FundingPositionsPanel.vue
          git commit -m "fix: format integrated funding frontend"
          git push origin HEAD:feature/issue-117-platform-0-9-1
