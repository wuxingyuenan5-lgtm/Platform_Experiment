name: Fix PR 27 Lint Once

on:
  push:
    branches:
      - hardening/v6-production-gate-observability-backup-restore
    paths:
      - '.github/workflows/fix-pr27-lint-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v6-production-gate-observability-backup-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Apply and verify Ruff fix
        working-directory: platform-backend
        run: |
          python -m ruff check app/production_monitoring.py --fix
          python -m ruff format app/production_monitoring.py
          python -m ruff check app/production_monitoring.py
      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/production_monitoring.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize production monitoring imports'
          git push origin HEAD:hardening/v6-production-gate-observability-backup-restore
