name: Mark Execution Schema Compatibility Exports

on:
  push:
    branches:
      - hardening/phase3-execution-schema-boundary
    paths:
      - '.github/workflows/fix-pr27-lint-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase3-execution-schema-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark explicit compatibility re-exports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/schemas.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'BatchLegRequest',
              'BatchLegResponse',
              'CreateExecutionBatchRequest',
              'CreateOrderRequest',
              'CreateStrategyRunRequest',
              'ExecutionBatchResponse',
              'OrderResponse',
              'PnlResponse',
              'PositionResponse',
              'StrategyRunResponse',
          )
          for name in names:
              plain = f'    {name},\n'
              explicit = f'    {name} as {name},\n'
              if explicit in source:
                  continue
              if plain not in source:
                  raise RuntimeError(f'Compatibility export not found: {name}')
              source = source.replace(plain, explicit, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate compatibility module
        working-directory: platform-backend
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check app/schemas.py app/execution_schemas.py tests/test_schema_boundaries.py
          python -m pytest tests/test_schema_boundaries.py
      - name: Commit corrected exports
        shell: bash
        run: |
          rm .github/workflows/fix-pr27-lint-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/schemas.py
          git add -u .github/workflows/fix-pr27-lint-once.yml
          git commit -m 'fix: mark execution schema compatibility exports'
          git push origin HEAD:hardening/phase3-execution-schema-boundary
