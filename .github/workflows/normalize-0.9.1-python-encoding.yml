name: Normalize 0.9.1 Python encoding

on:
  push:
    branches:
      - release/issue-117-0.9.1-user-system
    paths:
      - .github/workflows/normalize-0.9.1-python-encoding.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-117-0.9.1-user-system
          fetch-depth: 0

      - name: Remove UTF-8 BOM from maintained Python files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          changed = []
          for root in (Path('platform-backend'), Path('execution-runtime'), Path('scripts')):
              for path in root.rglob('*.py'):
                  raw = path.read_bytes()
                  if raw.startswith(b'\xef\xbb\xbf'):
                      path.write_bytes(raw[3:])
                      changed.append(path.as_posix())
          if not changed:
              raise SystemExit('No BOM-encoded Python files found')
          print('\n'.join(changed))
          PY

          git rm .github/workflows/normalize-0.9.1-python-encoding.yml
          git add platform-backend execution-runtime scripts
          git commit -m "fix: normalize Python source encoding for 0.9.1"
          git push origin HEAD:release/issue-117-0.9.1-user-system
