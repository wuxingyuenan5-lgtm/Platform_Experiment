name: Hedge Widget Error Boundary Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/hedge-widget-error-boundary-extraction.yml
      - scripts/apply-hedge-widget-error-boundary-extraction.py
      - platform-web/src/views/hedgeBoard/components/WidgetErrorBoundary.ts

permissions:
  contents: write

concurrency:
  group: hedge-widget-error-boundary-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical extraction
        run: python scripts/apply-hedge-widget-error-boundary-extraction.py

      - name: Validate component boundary
        working-directory: platform-web
        run: |
          pnpm exec eslint --max-warnings 0 \
            src/views/hedgeBoard/index.vue \
            src/views/hedgeBoard/components/WidgetErrorBoundary.ts
          pnpm type:check
          pnpm test:hedge-board-layout
          git diff --check

      - name: Push widget boundary extraction commit
        run: |
          if git diff --quiet -- platform-web/src/views/hedgeBoard/index.vue; then
            echo 'Widget error boundary extraction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-web/src/views/hedgeBoard/index.vue
          git commit -m 'refactor: delegate hedge widget error boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
