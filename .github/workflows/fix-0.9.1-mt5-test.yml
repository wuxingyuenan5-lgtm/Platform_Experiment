name: Fix 0.9.1 MT5 test integration

on:
  push:
    branches:
      - release/0.9.1-user-system
    paths:
      - .github/workflows/fix-0.9.1-mt5-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.1-user-system
          fetch-depth: 0

      - name: Make injected MT5 test platform-explicit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          path = Path('execution-runtime/tests/test_mt5_live_adapter.py')
          content = path.read_text(encoding='utf-8')
          old = '''    fake_mt5 = FakeRuntimeMt5()\n    monkeypatch.setitem(sys.modules, "MetaTrader5", fake_mt5)\n\n    adapter = Mt5LiveAdapter(runtime_settings(write_enabled=False))\n'''
          new = '''    fake_mt5 = FakeRuntimeMt5()\n    monkeypatch.setitem(sys.modules, "MetaTrader5", fake_mt5)\n    monkeypatch.setattr("app.mt5_live_adapter.platform.system", lambda: "Windows")\n\n    adapter = Mt5LiveAdapter(runtime_settings(write_enabled=False))\n'''
          if old not in content:
              raise SystemExit('Expected MT5 test block was not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/fix-0.9.1-mt5-test.yml
          git add execution-runtime/tests/test_mt5_live_adapter.py
          git commit -m "test: simulate Windows for injected MT5 provider"
          git push origin HEAD:release/0.9.1-user-system
