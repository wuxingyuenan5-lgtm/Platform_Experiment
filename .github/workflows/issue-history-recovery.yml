name: Issue History Recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-history-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Issue 117 body edit history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql \
            -f owner='wuxingyuenan5-lgtm' \
            -f name='Platform_Experiment' \
            -F number=117 \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){body userContentEdits(first:100){nodes{editedAt diff editor{login}}}}}}' \
            > "$RUNNER_TEMP/issue-117-edits.json"
      - name: Upload Issue body history
        uses: actions/upload-artifact@v4
        with:
          name: issue-117-edit-history
          path: ${{ runner.temp }}/issue-117-edits.json
          if-no-files-found: error
          retention-days: 1
