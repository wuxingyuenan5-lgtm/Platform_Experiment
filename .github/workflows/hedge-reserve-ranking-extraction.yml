name: Hedge Reserve Ranking Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/hedge-reserve-ranking-extraction.yml
      - scripts/apply-hedge-reserve-ranking-extraction.py
      - platform-web/src/views/hedgeBoard/components/ReserveRanking.ts

permissions:
  contents: write

concurrency:
  group: hedge-reserve-ranking-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical extraction
        run: python scripts/apply-hedge-reserve-ranking-extraction.py

      - name: Validate reserve ranking boundary
        working-directory: platform-web
        run: |
          pnpm exec eslint --max-warnings 0 \
            src/views/hedgeBoard/components/ReserveRanking.ts
          python ../scripts/frontend-no-new-debt.py
          pnpm type:check
          pnpm test:hedge-board-layout
          git diff --check

      - name: Push validated commits
        run: |
          if git diff --quiet -- \
            platform-web/scripts/verify-hedge-board-layout.cjs \
            platform-web/src/views/hedgeBoard/index.vue; then
            echo 'ReserveRanking extraction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- platform-web/scripts/verify-hedge-board-layout.cjs; then
            git add platform-web/scripts/verify-hedge-board-layout.cjs
            git commit -m 'test: freeze hedge reserve ranking contract'
          fi
          if ! git diff --quiet -- platform-web/src/views/hedgeBoard/index.vue; then
            git add platform-web/src/views/hedgeBoard/index.vue
            git commit -m 'refactor: delegate hedge reserve ranking'
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
