name: User System Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/user-system-e2e.yml'
      - 'platform-web/.env.development'
      - 'platform-web/.env.production'
      - 'platform-web/package.json'
      - 'platform-web/pnpm-lock.yaml'
      - 'platform-web/playwright.user-system.config.ts'
      - 'platform-web/e2e/user-system/**'
      - 'platform-web/src/access/**'
      - 'platform-web/src/api/platform/memberHoldings.ts'
      - 'platform-web/src/api/platform/userSystem.ts'
      - 'platform-web/src/router/guard/permissionGuard.ts'
      - 'platform-web/src/router/routes/modules/account.ts'
      - 'platform-web/src/router/routes/modules/risk.ts'
      - 'platform-web/src/store/modules/user.ts'
      - 'platform-web/src/views/account/**'
      - 'platform-web/src/views/sys/login/**'
      - 'platform-web/src/views/sys/register/**'
      - 'platform-web/src/views/sys/reset-password/**'
      - 'platform-web/src/views/users/**'
      - 'platform-api/app/auth.py'
      - 'platform-api/app/config.py'
      - 'platform-api/app/member_holding_*.py'
      - 'platform-api/app/schema_migrations.py'
      - 'platform-api/app/user_*.py'
      - 'platform-api/scripts/seed_user_system_e2e.py'
      - 'platform-api/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: user-system-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml
      - name: Install Platform API
        run: python -m pip install -e './platform-api[dev]'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: platform-web
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate isolated CEO credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          password = f"Cc9!{secrets.token_urlsafe(24)}"
          print(f"::add-mask::{password}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('E2E_CEO_USERNAME=e2e_ceo\n')
              output.write(f"E2E_CEO_PASSWORD={password}\n")
          PY
      - name: Run user-system browser acceptance
        working-directory: platform-web
        run: pnpm test:e2e:user-system
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-system-browser-e2e
          path: |
            platform-web/playwright-report/user-system
            platform-web/test-results/user-system
          if-no-files-found: warn
          retention-days: 3
