name: Fix Phase 1 Ruff Regex

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/fix-phase1-ruff-regex.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - name: Apply regex-based fix and commit diagnostics
        shell: bash
        run: |
          mkdir -p tasks
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('platform-backend/app/eod_reconciliation.py')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^\s{8}row = db\.execute\(\r?\n'
              r'\s+"SELECT \* FROM eod_reconciliation_reports WHERE id = \?",\r?\n'
              r'\s+\(report_id,\),\r?\n'
              r'\s+\)\.fetchone\(\)\r?\n',
              re.MULTILINE,
          )
          updated, count = pattern.subn('', source, count=1)
          Path('tasks/phase1-eod-fix.log').write_text(
              f'match_count={count}\nchanged={updated != source}\n',
              encoding='utf-8',
          )
          if count == 1:
              path.write_text(updated, encoding='utf-8')
          PY
          rm .github/workflows/fix-phase1-ruff-regex.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/eod_reconciliation.py tasks/phase1-eod-fix.log
          git add -u .github/workflows/fix-phase1-ruff-regex.yml
          git commit -m 'fix: apply regex-based EOD query cleanup'
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
