name: Issue 61 One-Time Patch

on:
  push:
    branches:
      - refactor/issue-61-shared-position-math

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-61-shared-position-math
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared Position Math patch
        run: python scripts/issue-61-apply.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract shared Position Math policy"
          git push origin HEAD:refactor/issue-61-shared-position-math
