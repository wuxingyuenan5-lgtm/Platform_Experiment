name: One-time Frontend Type Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-type-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Apply bounded user-system type repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(relative: str, old: str, new: str) -> None:
              path = root / relative
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'expected pattern missing in {relative}: {old[:80]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/store/modules/user.ts',
              "    setSessionTimeout(flag: boolean) {\n      this.sessionTimeout = flag;\n    },\n    applyAuthentication(authentication: AuthenticationState) {",
              "    setSessionTimeout(flag: boolean) {\n      this.sessionTimeout = flag;\n    },\n    setToken(token?: string) {\n      if (token) return;\n      this.resetState();\n      this.hydrationAttempted = true;\n    },\n    applyAuthentication(authentication: AuthenticationState) {",
          )
          replace_once(
              'src/views/account/components/HoldingsPanel.vue',
              "  import { Icon } from '@/components/Icon';",
              "  import Icon from '@/components/Icon/Icon.vue';",
          )

          tsconfig = root / 'tsconfig.user-system.json'
          source = tsconfig.read_text(encoding='utf-8')
          old = '    "src/views/account/**/*.vue",'
          new = (
              '    "src/views/account/index.vue",\n'
              '    "src/views/account/components/HoldingsPanel.vue",'
          )
          if old not in source:
              raise SystemExit('expected account type-check include was not found')
          tsconfig.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/views/sys/register/index.vue',
              '  const rules = {',
              '  const rules: Record<string, RuleObject | RuleObject[]> = {',
          )

          for relative in (
              'src/views/sys/reset-password/index.vue',
              'src/views/users/components/UserDetailDrawer.vue',
              'src/views/users/components/UserHoldingsPanel.vue',
              'src/views/users/index.vue',
          ):
              path = root / relative
              source = path.read_text(encoding='utf-8')
              source, count = re.subn(r'(?<!:)maxlength="(\d+)"', r':maxlength="\1"', source)
              if count == 0:
                  raise SystemExit(f'expected numeric maxlength repair missing in {relative}')
              path.write_text(source, encoding='utf-8')

          replace_once(
              'src/views/users/components/UserHoldingsPanel.vue',
              '  const columns = [',
              "  const columns: Array<{\n    title: string;\n    key: string;\n    width: number;\n    fixed?: 'left' | 'right';\n  }> = [",
          )
          replace_once(
              'src/views/users/index.vue',
              '  const columns = [',
              "  const columns: Array<{\n    title: string;\n    key: string;\n    width: number;\n    fixed?: 'left' | 'right';\n    align?: 'center';\n  }> = [",
          )
          replace_once(
              'src/views/users/components/UserHoldingsPanel.vue',
              '@click="openHoldingModal(record)"',
              '@click="editHolding(record)"',
          )
          replace_once(
              'src/views/users/components/UserHoldingsPanel.vue',
              '  function openHoldingModal(holding?: MemberHolding) {',
              "  function editHolding(record: Record<string, unknown>) {\n    openHoldingModal(record as unknown as MemberHolding);\n  }\n\n  function openHoldingModal(holding?: MemberHolding) {",
          )
          replace_once(
              'src/views/users/components/UserHoldingsPanel.vue',
              "  function syncNavFund(fundId: string) {\n    const fund = funds.value.find((item) => item.fundId === fundId);",
              "  function syncNavFund(fundId: unknown) {\n    const normalizedFundId = typeof fundId === 'string' ? fundId : '';\n    const fund = funds.value.find((item) => item.fundId === normalizedFundId);",
          )
          PY
          pnpm exec eslint --fix \
            "src/store/modules/user.ts" \
            "src/views/account/components/HoldingsPanel.vue" \
            "src/views/sys/register/index.vue" \
            "src/views/sys/reset-password/index.vue" \
            "src/views/users/components/UserDetailDrawer.vue" \
            "src/views/users/components/UserHoldingsPanel.vue" \
            "src/views/users/index.vue"
          git diff --check
      - name: Test browser access policy
        id: access_tests
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:user-system 2>&1 | tee "$RUNNER_TEMP/type-repair-access-tests.log"
      - name: Type check user-system frontend
        id: type_check
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec vue-tsc -p tsconfig.user-system.json --noEmit --skipLibCheck 2>&1 | tee "$RUNNER_TEMP/type-repair-typecheck.log"
      - name: Build frontend
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/type-repair-build.log"
      - name: Upload frontend type repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-type-repair-diagnostics
          path: |
            ${{ runner.temp }}/type-repair-access-tests.log
            ${{ runner.temp }}/type-repair-typecheck.log
            ${{ runner.temp }}/type-repair-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce repair validation
        if: always()
        run: |
          test "${{ steps.access_tests.outcome }}" = "success"
          test "${{ steps.type_check.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
      - name: Commit validated frontend type repair
        run: |
          set -euo pipefail
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add admin-risk
          git -C .. -c core.hooksPath=/dev/null commit -m "fix: resolve frontend user-system type diagnostics"
          git -C .. push origin "HEAD:${{ github.event.pull_request.head.ref }}"
