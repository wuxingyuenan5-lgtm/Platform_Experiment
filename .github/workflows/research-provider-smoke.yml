name: Research Provider Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/research-provider-smoke.yml'
      - 'platform-api/app/research_providers.py'
      - 'platform-api/scripts/smoke_research_providers.py'
      - 'platform-api/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: research-provider-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml

      - name: Install Platform Backend
        run: python -m pip install -e './platform-api[dev]'

      - name: Probe free research providers
        working-directory: platform-api
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_research_providers.py --timeout 60 | tee research-provider-smoke.json

      - name: Publish result summary
        if: always()
        working-directory: platform-api
        shell: bash
        run: |
          if [ -f research-provider-smoke.json ]; then
            echo '## Research Provider Smoke' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat research-provider-smoke.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-provider-smoke
          path: platform-api/research-provider-smoke.json
          if-no-files-found: warn
          retention-days: 7
