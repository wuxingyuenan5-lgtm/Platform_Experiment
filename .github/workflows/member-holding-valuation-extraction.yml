name: Member Holding Valuation Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/member-holding-valuation-extraction.yml
      - scripts/apply-member-holding-valuation-extraction.py
      - platform-api/app/member_holding_valuation.py
      - platform-api/tests/test_member_holding_valuation.py
      - platform-api/tests/test_architecture_member_holding_valuation.py

permissions:
  contents: write

concurrency:
  group: member-holding-valuation-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Platform API dependencies
        working-directory: platform-api
        run: python -m pip install -e '.[dev]'

      - name: Apply valuation extraction
        run: python scripts/apply-member-holding-valuation-extraction.py

      - name: Validate valuation boundary
        working-directory: platform-api
        run: |
          ruff check \
            app/member_holding_valuation.py \
            app/member_holding_service.py \
            tests/test_member_holding_valuation.py \
            tests/test_architecture_member_holding_valuation.py \
            tests/test_member_holding_architecture.py
          pyright
          pytest -q \
            tests/test_member_holding_valuation.py \
            tests/test_architecture_member_holding_valuation.py \
            tests/test_member_holding_architecture.py \
            tests/test_member_holding_decimal.py \
            tests/test_member_holdings.py \
            tests/test_member_holding_scope.py \
            tests/test_member_holding_assurance.py \
            tests/test_member_holding_source_contract.py \
            tests/test_member_holding_audit_transactions.py
          git diff --check

      - name: Push validated commits
        run: |
          if git diff --quiet -- \
            platform-api/app/member_holding_service.py \
            platform-api/pyproject.toml \
            platform-api/tests/test_member_holding_architecture.py; then
            echo 'Member holding valuation extraction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-api/app/member_holding_service.py
          git commit -m 'refactor: delegate member holding valuation'
          git add platform-api/pyproject.toml platform-api/tests/test_member_holding_architecture.py
          git commit -m 'test: freeze member holding valuation boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
