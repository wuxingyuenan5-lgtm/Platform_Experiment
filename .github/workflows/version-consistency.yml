name: Version Consistency

on:
  push:
    branches:
      - main
      - refactor/platform-0-9-3-repository-and-context-optimization
      - refactor/platform-0-9-3-codebase-and-build-simplification
  pull_request:
    branches:
      - main
      - feature/issue-134-platform-0-9-1-unified-delivery
      - refactor/platform-0-9-3-repository-and-context-optimization
    paths:
      - VERSION
      - platform-web/package.json
      - platform-web/internal/vite-config/src/config/application.ts
      - platform-web/src/views/sys/about/index.vue
      - platform-web/.env.development
      - platform-web/.env.production
      - platform-api/pyproject.toml
      - platform-api/app/application.py
      - execution-runtime/pyproject.toml
      - execution-runtime/app/main.py
      - execution-runtime/app/models.py
      - README.md
      - docs/README.md
      - docs/codex/current-state.md
      - scripts/phase3-materialize/**
      - scripts/check-version-consistency.py
      - scripts/bump-version.py
      - platform-api/tests/test_architecture_version_consistency.py
      - platform-api/tests/test_architecture_ci_and_version_tooling.py
      - execution-runtime/tests/test_runtime_journal.py
      - .github/workflows/version-consistency.yml

permissions:
  contents: read

concurrency:
  group: version-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained release versions
        run: python scripts/check-version-consistency.py

  phase3-materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 148 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize verified Phase 3 commits
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: '0'
          PHASE3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/phase3-materialize/run.py
      - name: Upload Phase 3 materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-materialization-${{ github.sha }}
          path: ${{ runner.temp }}/phase3-materialize-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
