name: Version Consistency

on:
  push:
    branches:
      - main
      - refactor/platform-0-9-3-repository-and-context-optimization
      - refactor/platform-0-9-3-codebase-and-build-simplification
  pull_request:
    branches:
      - main
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - VERSION
      - platform-web/package.json
      - platform-web/internal/vite-config/src/config/application.ts
      - platform-web/src/views/sys/about/index.vue
      - platform-web/.env.development
      - platform-web/.env.production
      - platform-api/pyproject.toml
      - platform-api/app/application.py
      - execution-runtime/pyproject.toml
      - execution-runtime/app/main.py
      - execution-runtime/app/models.py
      - README.md
      - docs/README.md
      - docs/codex/current-state.md
      - scripts/check-version-consistency.py
      - scripts/bump-version.py
      - platform-api/tests/test_architecture_version_consistency.py
      - platform-api/tests/test_architecture_ci_and_version_tooling.py
      - execution-runtime/tests/test_runtime_journal.py
      - .github/workflows/version-consistency.yml

permissions:
  contents: read

concurrency:
  group: version-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained release versions
        run: python scripts/check-version-consistency.py

  phase3-pnpm-bootstrap:
    if: github.event_name == 'push' && github.ref_name == 'refactor/platform-0-9-3-codebase-and-build-simplification'
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Export exact pnpm executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase3-tool"
          cp -L "$(command -v pnpm)" "$RUNNER_TEMP/phase3-tool/pnpm"
          chmod +x "$RUNNER_TEMP/phase3-tool/pnpm"
          pnpm --version > "$RUNNER_TEMP/phase3-tool/version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-pnpm-9-15-9
          path: ${{ runner.temp }}/phase3-tool/
          if-no-files-found: error
          retention-days: 1
