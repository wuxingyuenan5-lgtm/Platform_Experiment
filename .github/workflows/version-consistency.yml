name: Version Consistency

on:
  push:
    branches:
      - main
      - refactor/platform-0-9-3-*
  pull_request:
    branches:
      - main
      - refactor/platform-0-9-3-*
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - VERSION
      - platform-web/package.json
      - platform-web/internal/vite-config/src/config/application.ts
      - platform-web/src/views/sys/about/index.vue
      - platform-web/.env.development
      - platform-web/.env.production
      - platform-api/pyproject.toml
      - platform-api/app/application.py
      - execution-runtime/pyproject.toml
      - execution-runtime/app/main.py
      - execution-runtime/app/models.py
      - README.md
      - docs/README.md
      - docs/codex/current-state.md
      - scripts/check-version-consistency.py
      - scripts/bump-version.py
      - platform-api/tests/test_architecture_version_consistency.py
      - platform-api/tests/test_architecture_ci_and_version_tooling.py
      - execution-runtime/tests/test_runtime_journal.py
      - .github/workflows/version-consistency.yml

permissions:
  contents: read

concurrency:
  group: version-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained release versions
        run: python scripts/check-version-consistency.py
