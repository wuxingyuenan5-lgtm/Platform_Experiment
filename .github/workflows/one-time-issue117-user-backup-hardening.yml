name: One-time User Backup Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue117-user-backup-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Apply bounded user backup patch
        run: |
          python scripts/apply-issue117-user-backup-hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/tests/test_disaster_recovery.py')
          source = path.read_text(encoding='utf-8')
          old = '        assert "password" not in serialized_manifest\n'
          new = (
              '        assert "password_hash" not in serialized_manifest\n'
              '        assert "token_hash" not in serialized_manifest\n'
              '        assert "$argon2" not in serialized_manifest\n'
          )
          if source.count(old) != 1:
              raise SystemExit('expected one stale password leak assertion')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format patched files
        working-directory: platform-backend
        run: python -m ruff format app/user_backup_archive.py app/disaster_recovery.py tests/test_disaster_recovery.py
      - name: Backend lint
        id: lint
        continue-on-error: true
        working-directory: platform-backend
        run: python -m ruff check app tests > "$RUNNER_TEMP/ruff.log" 2>&1
      - name: Backend type check
        id: types
        continue-on-error: true
        working-directory: platform-backend
        run: python -m pyright > "$RUNNER_TEMP/pyright.log" 2>&1
      - name: Backend tests
        id: tests
        continue-on-error: true
        working-directory: platform-backend
        run: python -m pytest > "$RUNNER_TEMP/pytest.log" 2>&1
      - name: Validate repository Markdown and version
        id: repository
        continue-on-error: true
        run: |
          {
            python scripts/check-documentation-consistency.py
            python scripts/check-version-consistency.py
            git diff --check
          } > "$RUNNER_TEMP/repository.log" 2>&1
      - name: Capture patched files
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/patched/platform-backend/app" "$RUNNER_TEMP/patched/platform-backend/tests"
          cp platform-backend/app/user_backup_archive.py "$RUNNER_TEMP/patched/platform-backend/app/"
          cp platform-backend/app/disaster_recovery.py "$RUNNER_TEMP/patched/platform-backend/app/"
          cp platform-backend/tests/test_disaster_recovery.py "$RUNNER_TEMP/patched/platform-backend/tests/"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue117-user-backup-hardening-diagnostics
          path: |
            ${{ runner.temp }}/ruff.log
            ${{ runner.temp }}/pyright.log
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/repository.log
            ${{ runner.temp }}/patched
          if-no-files-found: error
          retention-days: 3
      - name: Enforce validation
        run: |
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.repository.outcome }}" = success
      - name: Commit validated hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            platform-backend/app/user_backup_archive.py \
            platform-backend/app/disaster_recovery.py \
            platform-backend/tests/test_disaster_recovery.py
          git -c core.hooksPath=/dev/null commit -m "feat: include user avatars in production backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
