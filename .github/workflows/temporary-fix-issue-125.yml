name: Temporary Issue 125 Frontend Fixer

on:
  push:
    branches:
      - feature/issue-125-hedge-board-research-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-issue-125-frontend-fixer
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(frontend):') }}
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-125-hedge-board-research-upgrade
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: admin-risk
        run: pnpm install --frozen-lockfile
      - name: Fix bounded Issue 125 frontend files
        working-directory: admin-risk
        run: |
          pnpm exec eslint --fix \
            src/api/hedgeResearch.ts \
            src/router/routes/modules/hedge.ts \
            src/views/hedgeBoard/aShare/index.vue \
            src/views/hedgeBoard/aShare/useAShareResearch.ts \
            src/views/hedgeBoard/aShare/components/*.vue \
            src/views/hedgeBoard/macro/*.vue \
            src/views/hedgeBoard/research/components/*.vue \
            src/views/hedgeBoard/nativeData/marketDetailCatalog.ts
      - name: Commit fixer output
        run: |
          if git diff --quiet; then
            echo "No frontend fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-risk/src/api/hedgeResearch.ts \
            admin-risk/src/router/routes/modules/hedge.ts \
            admin-risk/src/views/hedgeBoard/aShare \
            admin-risk/src/views/hedgeBoard/macro \
            admin-risk/src/views/hedgeBoard/research \
            admin-risk/src/views/hedgeBoard/nativeData/marketDetailCatalog.ts
          git commit -m "chore(frontend): normalize Issue 125 files"
          git push origin HEAD:feature/issue-125-hedge-board-research-upgrade
