name: Cleanup Phase 1 Refactor Scaffolding

on:
  push:
    branches:
      - hardening/refactor-phase1-composition-boundaries
    paths:
      - '.github/workflows/cleanup-phase1-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/refactor-phase1-composition-boundaries
          fetch-depth: 0
      - name: Restore canonical workflow and keep architecture test gated
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/platform-ci.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/platform-ci.yml')
          source = path.read_text(encoding='utf-8')
          anchor = '            tests/test_eod_policy.py \\\n'
          entry = '            tests/test_architecture_boundaries.py \\\n'
          if entry not in source:
              if anchor not in source:
                  raise RuntimeError('Backend strict lint anchor not found')
              source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm -f \
            .github/workflows/apply-phase1-once.yml \
            .github/workflows/apply-phase1-capture.yml \
            .github/workflows/cleanup-phase1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: restore canonical CI after composition refactor'
          git push origin HEAD:hardening/refactor-phase1-composition-boundaries
