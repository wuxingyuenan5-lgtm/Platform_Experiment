name: Platform Web Directory Migration

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/platform-web-directory-migration.yml'

permissions:
  contents: write

concurrency:
  group: platform-web-directory-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply atomic mechanical migration
        run: python scripts/apply-platform-web-directory-migration.py

      - name: Validate complete target tree
        shell: bash
        run: |
          python -m py_compile \
            scripts/audit-directory-migration.py \
            scripts/apply-platform-web-directory-migration.py \
            scripts/check-repository-structure.py \
            scripts/check-documentation-consistency.py \
            scripts/check-version-consistency.py \
            scripts/check-codex-context.py
          python scripts/audit-directory-migration.py \
            --mode post-rename \
            --target admin-risk \
            --fail-on-unclassified
          python scripts/check-repository-structure.py
          python scripts/check-documentation-consistency.py
          python scripts/check-version-consistency.py
          python scripts/check-codex-context.py
          git diff --cached --check
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('platform-web/package.json').read_text(encoding='utf-8'))
          if package.get('name') != 'vg-platform-web':
              raise SystemExit('Platform Web package identity was not migrated')
          if Path('admin-risk').exists() or not Path('platform-web').is_dir():
              raise SystemExit('Platform Web directory migration is incomplete')
          PY

      - name: Preserve final workflow content and build seed commit
        shell: bash
        run: |
          mkdir -p migration-evidence/final-workflows
          cp .github/workflows/hedge-board-e2e.yml migration-evidence/final-workflows/
          cp .github/workflows/platform-ci.yml migration-evidence/final-workflows/
          cp .github/workflows/platform-visual-baseline.yml migration-evidence/final-workflows/
          cp .github/workflows/user-system-e2e.yml migration-evidence/final-workflows/
          cp .github/workflows/version-consistency.yml migration-evidence/final-workflows/

          git restore --source=HEAD --staged --worktree -- \
            .github/workflows/hedge-board-e2e.yml \
            .github/workflows/platform-ci.yml \
            .github/workflows/platform-visual-baseline.yml \
            .github/workflows/user-system-e2e.yml \
            .github/workflows/version-consistency.yml
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Seed commit must not modify workflow files.' >&2
            git diff --cached --name-only | grep '^.github/workflows/' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: seed Platform Web migration objects'

          git rev-parse HEAD^ > migration-evidence/parent-sha.txt
          git rev-parse HEAD > migration-evidence/seed-commit-sha.txt
          git rev-parse HEAD^{tree} > migration-evidence/seed-root-tree-sha.txt
          git rev-parse HEAD:platform-web > migration-evidence/platform-web-tree-sha.txt
          git ls-tree HEAD:platform-web > migration-evidence/platform-web-top-level.txt
          git diff-tree --no-commit-id --name-status -r -M HEAD > migration-evidence/seed-changed-files.txt

      - name: Push temporary object seed
        shell: bash
        run: |
          git push --force origin HEAD:refs/heads/automation/issue-136-platform-web-tree-seed

      - name: Upload seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-web-directory-seed-${{ github.sha }}
          path: migration-evidence
          if-no-files-found: error
          retention-days: 14
