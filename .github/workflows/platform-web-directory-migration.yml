name: Platform Web Directory Migration

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    paths:
      - '.github/workflows/platform-web-directory-migration.yml'

permissions:
  contents: read

concurrency:
  group: platform-web-directory-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply atomic mechanical migration
        run: python scripts/apply-platform-web-directory-migration.py

      - name: Validate staged repository tree
        shell: bash
        run: |
          python -m py_compile \
            scripts/audit-directory-migration.py \
            scripts/apply-platform-web-directory-migration.py \
            scripts/check-repository-structure.py \
            scripts/check-documentation-consistency.py \
            scripts/check-version-consistency.py \
            scripts/check-codex-context.py
          python scripts/audit-directory-migration.py \
            --mode post-rename \
            --target admin-risk \
            --fail-on-unclassified
          python scripts/check-repository-structure.py
          python scripts/check-documentation-consistency.py
          python scripts/check-version-consistency.py
          python scripts/check-codex-context.py
          git diff --cached --check
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('platform-web/package.json').read_text(encoding='utf-8'))
          if package.get('name') != 'vg-platform-web':
              raise SystemExit('Platform Web package identity was not migrated')
          if Path('admin-risk').exists() or not Path('platform-web').is_dir():
              raise SystemExit('Platform Web directory migration is incomplete')
          PY

      - name: Build validated migration evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: rename Platform Web directory'
          mkdir -p migration-evidence
          git rev-parse HEAD^ > migration-evidence/parent-sha.txt
          git rev-parse HEAD > migration-evidence/local-commit-sha.txt
          git rev-parse HEAD^{tree} > migration-evidence/root-tree-sha.txt
          git rev-parse HEAD^:admin-risk > migration-evidence/legacy-platform-web-tree-sha.txt
          git rev-parse HEAD:platform-web > migration-evidence/platform-web-tree-sha.txt
          git rev-parse HEAD^:admin-risk/docs > migration-evidence/legacy-docs-tree-sha.txt
          git rev-parse HEAD:platform-web/docs > migration-evidence/platform-web-docs-tree-sha.txt
          git ls-tree HEAD^:admin-risk > migration-evidence/legacy-platform-web-top-level.txt
          git ls-tree HEAD:platform-web > migration-evidence/platform-web-top-level.txt
          git ls-tree -r HEAD:platform-web > migration-evidence/platform-web-recursive.txt
          git diff-tree --no-commit-id --name-status -r -M HEAD > migration-evidence/changed-files.txt
          git bundle create migration-evidence/platform-web-migration.bundle HEAD ^HEAD^
          git bundle verify migration-evidence/platform-web-migration.bundle

      - name: Upload validated migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-web-directory-migration-${{ github.sha }}
          path: migration-evidence
          if-no-files-found: error
          retention-days: 14
