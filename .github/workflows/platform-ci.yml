name: Platform CI

on:
  push:
    branches:
      - hardening/phase3-execution-schema-boundary
    paths:
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase3-execution-schema-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Ruff import layout
        working-directory: platform-backend
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check app/schemas.py --fix
          python -m ruff check app/schemas.py app/execution_schemas.py tests/test_schema_boundaries.py
          python -m pytest tests/test_schema_boundaries.py
      - name: Restore canonical CI and commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/platform-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/schemas.py .github/workflows/platform-ci.yml
          git commit -m 'style: normalize execution schema compatibility imports'
          git push origin HEAD:hardening/phase3-execution-schema-boundary
