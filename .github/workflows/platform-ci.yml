name: Platform CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'hardening/**'
      - 'docs/**'
      - 'chore/**'
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/**'
      - 'admin-risk/mock/**'
      - 'admin-risk/docs/quality/**'
      - 'admin-risk/docs/START-HERE.md'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.json'
      - 'admin-risk/tsconfig.strategy.json'
      - '00-人工可读目录/**'
      - 'docs/architecture/**'
      - 'docs/codex/**'
      - 'docs/contracts/**'
      - 'docs/database/**'
      - 'docs/engineering/**'
      - 'docs/planning/**'
      - 'docs/technical/**'
      - 'docs/operations/**'
      - 'tasks/**'
      - 'outputs/README.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/**'
      - 'admin-risk/mock/**'
      - 'admin-risk/docs/quality/**'
      - 'admin-risk/docs/START-HERE.md'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.json'
      - 'admin-risk/tsconfig.strategy.json'
      - '00-人工可读目录/**'
      - 'docs/architecture/**'
      - 'docs/codex/**'
      - 'docs/contracts/**'
      - 'docs/database/**'
      - 'docs/engineering/**'
      - 'docs/planning/**'
      - 'docs/technical/**'
      - 'docs/operations/**'
      - 'tasks/**'
      - 'outputs/README.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue40-schema-extraction:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/issue-40-financial-fact-schemas' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-40-financial-fact-schemas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact schema extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/financial_facts.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Literal\n', '')
          text = text.replace('from pydantic import BaseModel, Field, model_validator\n\n', '')

          database_import = 'from app.database import connection\n'
          schema_import = '''from app.financial_fact_schemas import (
              CreateFinancialFactRequest,
              FinancialFactResponse,
              FinancialFactType,
              FinancialProjectionRebuildResponse,
              FormalNavSnapshotResponse,
              FormalPnlResponse,
              FormalPositionResponse,
              TRADE_FACT_TYPES,
          )

'''
          if schema_import not in text:
              text = text.replace(database_import, database_import + schema_import)

          type_start = text.index('FinancialFactType = Literal[')
          projected_start = text.index('PROJECTED_FACT_TYPES =', type_start)
          text = text[:type_start] + text[projected_start:]
          text = text.replace('TRADE_FACT_TYPES = {"trade_fill", "deal"}\n', '')

          class_start = text.index('class CreateFinancialFactRequest')
          ensure_start = text.index('def ensure_schema() -> None:', class_start)
          text = text[:class_start] + text[ensure_start:]

          for class_name in (
              'CreateFinancialFactRequest',
              'FinancialFactResponse',
              'FormalPositionResponse',
              'FormalPnlResponse',
              'FormalNavSnapshotResponse',
              'FinancialProjectionRebuildResponse',
          ):
              assert f'class {class_name}' not in text
          assert 'from app.financial_fact_schemas import (' in text
          assert 'def normalize_fact(request: CreateFinancialFactRequest)' in text
          assert 'SCHEMA_SQL = """' in text
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q platform-backend/app/financial_facts.py platform-backend/app/financial_fact_schemas.py
      - name: Restore CI and commit the source-only change
        run: |
          git checkout origin/main -- .github/workflows/platform-ci.yml
          rm -f .github/workflows/issue-40-apply-schema-extraction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/financial_facts.py .github/workflows/platform-ci.yml .github/workflows/issue-40-apply-schema-extraction.yml
          git commit -m 'Use extracted FinancialFact API schemas'
          git push origin HEAD:refactor/issue-40-financial-fact-schemas

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Issue branch task and PR uniqueness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check-workstream.py
      - name: Scan tracked files for credential material
        run: python scripts/scan-secrets.py
      - name: Check repository structure and architecture boundaries
        run: python scripts/check-repository-structure.py

  execution-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution-runtime/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Runtime full lint gate
        shell: bash
        run: |
          if ! python -m ruff check app tests > /tmp/runtime-ruff.log 2>&1; then
            cat /tmp/runtime-ruff.log
            exit 1
          fi
      - name: Runtime progressive type gate
        shell: bash
        run: |
          if ! python -m pyright > /tmp/runtime-pyright.log 2>&1; then
            cat /tmp/runtime-pyright.log
            exit 1
          fi
      - name: Upload runtime lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ruff-log
          path: /tmp/runtime-ruff.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload runtime type diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pyright-log
          path: /tmp/runtime-pyright.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Test classified runtime suites
        shell: bash
        run: |
          if ! (
            python -m pytest -m unit &&
            python -m pytest -m integration &&
            python -m pytest -m live_safety
          ) > /tmp/runtime-pytest.log 2>&1; then
            tail -n 320 /tmp/runtime-pytest.log
            exit 1
          fi
      - name: Upload runtime pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pytest-log
          path: /tmp/runtime-pytest.log
          if-no-files-found: ignore
          retention-days: 3

  platform-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Backend full lint gate
        shell: bash
        run: |
          if ! python -m ruff check app tests > /tmp/backend-ruff.log 2>&1; then
            cat /tmp/backend-ruff.log
            exit 1
          fi
      - name: Backend progressive type gate
        shell: bash
        run: |
          if ! python -m pyright > /tmp/backend-pyright.log 2>&1; then
            cat /tmp/backend-pyright.log
            exit 1
          fi
      - name: Upload backend lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-log
          path: /tmp/backend-ruff.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload backend type diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pyright-log
          path: /tmp/backend-pyright.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Test classified backend suites
        shell: bash
        run: |
          if ! (
            python -m pytest -m architecture &&
            python -m pytest -m unit &&
            python -m pytest -m integration &&
            python -m pytest -m live_safety
          ) > /tmp/backend-pytest.log 2>&1; then
            tail -n 620 /tmp/backend-pytest.log
            exit 1
          fi
      - name: Upload backend pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-log
          path: /tmp/backend-pytest.log
          if-no-files-found: ignore
          retention-days: 3

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        env:
          HUSKY: '0'
        run: |
          if ! pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1; then
            tail -n 80 /tmp/pnpm-install.log
            exit 1
          fi
      - name: Upload install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-install-log
          path: /tmp/pnpm-install.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Lint maintained trading frontend
        shell: bash
        run: |
          if ! pnpm exec eslint --max-warnings 0 \
            "src/api/platform/**/*.{ts,tsx}" \
            "src/hooks/trading/**/*.{ts,tsx}" \
            "src/views/strategy/funding-carry/**/*.{vue,ts,tsx}" \
            > /tmp/frontend-eslint.log 2>&1; then
            tail -n 120 /tmp/frontend-eslint.log
            exit 1
          fi
      - name: Enforce frontend no-new-debt gate
        run: python ../scripts/frontend-no-new-debt.py
      - name: Upload frontend lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-log
          path: /tmp/frontend-eslint.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Type check strategy frontend
        shell: bash
        run: |
          if ! pnpm type:check > /tmp/frontend-typecheck.log 2>&1; then
            tail -n 80 /tmp/frontend-typecheck.log
            exit 1
          fi
      - name: Upload type-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-log
          path: /tmp/frontend-typecheck.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Build frontend
        run: pnpm build
