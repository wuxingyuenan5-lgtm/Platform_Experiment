name: Platform CI

on:
  push:
    branches:
      - hardening/phase3-execution-schema-boundary
    paths:
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: write

jobs:
  restore-readiness-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase3-execution-schema-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add explicit compatibility export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/schemas.py')
          source = path.read_text(encoding='utf-8')
          export = (
              'from app.execution_schemas import (\n'
              '    StrategyV1ReadinessResponse as StrategyV1ReadinessResponse,\n'
              ')\n'
          )
          if export not in source:
              anchor = 'class RuntimeReadinessResponse(BaseModel):\n'
              if anchor not in source:
                  raise RuntimeError('Runtime readiness schema anchor not found')
              source = source.replace(anchor, export + '\n' + anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Validate repaired schema surface
        working-directory: platform-backend
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check app/schemas.py app/execution_schemas.py tests/test_schema_boundaries.py
          python -m pytest tests/test_schema_boundaries.py tests/test_v1_readiness.py
      - name: Restore canonical CI and commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/platform-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/schemas.py .github/workflows/platform-ci.yml
          git commit -m 'fix: restore strategy readiness schema compatibility export'
          git push origin HEAD:hardening/phase3-execution-schema-boundary
