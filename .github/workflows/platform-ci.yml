name: Platform CI

on:
  push:
    branches:
      - hardening/phase4-financial-projection-boundaries
    paths:
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: write

jobs:
  rename-operational-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase4-financial-projection-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename projection function without changing behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/trading.py')
          source = path.read_text(encoding='utf-8')
          old = 'record_fill_and_update_projections'
          new = 'record_fill_and_update_operational_projections'
          if source.count(old) != 2:
              raise RuntimeError(f'Expected two projection references, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Validate renamed boundary
        working-directory: platform-backend
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check app/trading.py tests/test_projection_boundaries.py
          python -m pytest tests/test_projection_boundaries.py tests/test_trading_flow.py tests/test_position_calculation.py
      - name: Restore canonical CI and commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/platform-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/trading.py .github/workflows/platform-ci.yml
          git commit -m 'refactor: name operational financial projections explicitly'
          git push origin HEAD:hardening/phase4-financial-projection-boundaries
