name: Platform CI

on:
  push:
    branches:
      - main
      - refactor/frontend-architecture-v6
      - 'hardening/**'
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/api/platform/**'
      - 'admin-risk/src/hooks/trading/**'
      - 'admin-risk/src/views/strategy/funding-carry/**'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.strategy.json'
      - 'scripts/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/api/platform/**'
      - 'admin-risk/src/hooks/trading/**'
      - 'admin-risk/src/views/strategy/funding-carry/**'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.strategy.json'
      - 'scripts/**'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution-runtime/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Phase 1 lint gate
        run: >-
          python -m ruff check
          app/main.py
          app/journal.py
          tests/test_atomic_command_claim.py
      - name: Full lint debt inventory
        continue-on-error: true
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest

  platform-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Phase 1 lint gate
        run: >-
          python -m ruff check
          app/security.py
          app/trading.py
          tests/test_order_safety_fail_closed.py
          tests/test_secret_safety.py
          tests/test_trading_flow.py
      - name: Full lint debt inventory
        continue-on-error: true
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check strategy frontend
        run: pnpm type:check
      - name: Build frontend
        run: pnpm build
