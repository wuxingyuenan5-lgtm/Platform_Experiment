name: Platform CI

on:
  push:
    branches:
      - refactor/frontend-architecture-v6
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/api/platform/**'
      - 'admin-risk/src/hooks/trading/**'
      - 'admin-risk/src/views/strategy/funding-carry/**'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.strategy.json'
      - 'scripts/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'execution-runtime/**'
      - 'platform-backend/**'
      - 'admin-risk/src/api/platform/**'
      - 'admin-risk/src/hooks/trading/**'
      - 'admin-risk/src/views/strategy/funding-carry/**'
      - 'admin-risk/package.json'
      - 'admin-risk/pnpm-lock.yaml'
      - 'admin-risk/tsconfig.strategy.json'
      - 'scripts/**'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution-runtime/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest

  platform-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest

  frontend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.1.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check strategy frontend
        run: pnpm type:check
