name: Platform CI

on:
  push:
    branches:
      - refactor/phase1-composition-boundaries
    paths:
      - 'scripts/apply_phase1_composition_refactor.py'
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: read

jobs:
  apply-composition-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase1-composition-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source changes
        run: python scripts/apply_phase1_composition_refactor.py
      - name: Install backend tooling
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Format and validate backend
        working-directory: platform-backend
        run: |
          python -m ruff format app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py tests/test_architecture_boundaries.py
          python -m ruff check app/main.py app/auth.py app/execution_risk.py app/eod_reconciliation.py app/execution_exposure.py tests/test_architecture_boundaries.py
          python -m pytest
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend README.md AGENTS.md docs/architecture/README.md
          git diff --cached --quiet && exit 1
          git commit -m 'refactor: make backend composition dependencies explicit'
          git push origin HEAD:refactor/phase1-composition-boundaries
