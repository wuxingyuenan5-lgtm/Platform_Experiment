name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      runtime: ${{ steps.scope.outputs.runtime }}
      frontend: ${{ steps.scope.outputs.frontend }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect affected areas
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python scripts/ci-scope.py --full --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci-scope.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

  repository-safety:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PR workstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check-workstream.py
      - name: Check repository structure and architecture boundaries
        run: python scripts/check-repository-structure.py
      - name: Check documentation consistency
        run: python scripts/check-documentation-consistency.py

  execution-runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution-runtime/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Runtime lint
        run: python -m ruff check app tests
      - name: Runtime type check
        run: python -m pyright
      - name: Runtime tests
        run: python -m pytest -m "unit or integration or live_safety"

  platform-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Backend lint
        run: python -m ruff check app tests
      - name: Backend type check
        run: python -m pyright
      - name: Backend tests
        run: python -m pytest -m "architecture or unit or integration or live_safety"

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Lint maintained trading frontend
        run: |
          pnpm exec eslint --max-warnings 0 \
            "src/api/platform/**/*.{ts,tsx}" \
            "src/hooks/trading/**/*.{ts,tsx}" \
            "src/views/strategy/funding-carry/**/*.{vue,ts,tsx}"
      - name: Enforce frontend no-new-debt gate
        run: python ../scripts/frontend-no-new-debt.py
      - name: Type check strategy frontend
        run: pnpm type:check
      - name: Build frontend
        run: pnpm build
