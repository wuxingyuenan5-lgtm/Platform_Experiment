name: Platform CI

on:
  push:
    branches:
      - hardening/phase3-execution-schema-boundary
    paths:
      - '.github/workflows/platform-ci.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase3-execution-schema-boundary
          fetch-depth: 0
      - name: Mark explicit compatibility exports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('platform-backend/app/schemas.py')
          source = path.read_text(encoding='utf-8')
          names = (
              'BatchLegRequest',
              'BatchLegResponse',
              'CreateExecutionBatchRequest',
              'CreateOrderRequest',
              'CreateStrategyRunRequest',
              'ExecutionBatchResponse',
              'OrderResponse',
              'PnlResponse',
              'PositionResponse',
              'StrategyRunResponse',
          )
          for name in names:
              plain = f'    {name},\n'
              explicit = f'    {name} as {name},\n'
              if explicit in source:
                  continue
              if plain not in source:
                  raise RuntimeError(f'Compatibility export not found: {name}')
              source = source.replace(plain, explicit, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Restore canonical CI and commit source
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/platform-ci.yml
          rm -f \
            .github/workflows/apply-phase1-capture.yml \
            .github/workflows/fix-pr27-lint-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform-backend/app/schemas.py
          git add -A .github/workflows
          git commit -m 'fix: mark execution schema compatibility exports'
          git push origin HEAD:hardening/phase3-execution-schema-boundary
