name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-api:
    name: platform-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform-api/pyproject.toml
      - name: Install Platform API
        run: python -m pip install -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Lint Platform API
        run: python -m ruff check app tests
      - name: Type check Platform API
        run: python -m pyright
      - name: Test Platform API
        run: python -m pytest -m "architecture or unit or integration or live_safety"

  execution-runtime:
    name: execution-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: execution-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution-runtime/pyproject.toml
      - name: Install Execution Runtime
        run: python -m pip install -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Lint Execution Runtime
        run: python -m ruff check app tests
      - name: Type check Execution Runtime
        run: python -m pyright
      - name: Test Execution Runtime
        run: python -m pytest -m "unit or integration or live_safety"

  platform-web:
    name: platform-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml
      - name: Install Platform Web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Test formal route manifest
        run: node scripts/test-formal-route-manifest.cjs
      - name: Test browser access policy
        run: pnpm test:user-system
      - name: Check frontend architecture boundaries
        run: pnpm test:codebase-boundaries
      - name: Type check strategy frontend
        run: pnpm type:check
      - name: Type check user-system frontend
        run: pnpm exec vue-tsc -p tsconfig.user-system.json --noEmit --skipLibCheck
      - name: Build Platform Web
        run: pnpm build
