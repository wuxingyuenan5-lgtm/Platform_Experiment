name: Issue 69 Import Fix

on:
  push:
    branches:
      - refactor/issue-69-venue-reconciliation-repository

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-69-venue-reconciliation-repository
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply import ordering fix
        run: python scripts/issue-69-fix-imports.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Venue Reconciliation repository imports"
          git push origin HEAD:refactor/issue-69-venue-reconciliation-repository
