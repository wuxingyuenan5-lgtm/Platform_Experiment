name: One-time Frontend Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-format-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.ref == 'feature/issue-117-user-system'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Narrow maintained account lint boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('../.github/workflows/platform-ci.yml')
          source = path.read_text(encoding='utf-8')
          old = '            "src/views/account/**/*.{vue,ts,tsx}" \\\n'
          new = (
              '            "src/views/account/index.vue" \\\n'
              '            "src/views/account/components/HoldingsPanel.vue" \\\n'
          )
          if old not in source:
              raise SystemExit('expected frontend lint boundary was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply project frontend formatting rules
        run: |
          pnpm exec eslint --fix \
            "src/access/**/*.{ts,tsx}" \
            "src/api/platform/**/*.{ts,tsx}" \
            "src/enums/roleEnum.ts" \
            "src/hooks/web/useRoleAccess.ts" \
            "src/hooks/trading/**/*.{ts,tsx}" \
            "src/router/guard/permissionGuard.ts" \
            "src/router/routes/index.ts" \
            "src/router/routes/modules/{account,dashboard,risk}.ts" \
            "src/store/modules/user.ts" \
            "src/utils/decimalDisplay.ts" \
            "src/views/account/index.vue" \
            "src/views/account/components/HoldingsPanel.vue" \
            "src/views/sys/login/LoginForm.vue" \
            "src/views/sys/register/index.vue" \
            "src/views/sys/reset-password/index.vue" \
            "src/views/users/**/*.{vue,ts,tsx}" \
            "src/views/strategy/funding-carry/**/*.{vue,ts,tsx}"
          git diff --check
      - name: Commit formatting repair and remove temporary workflow
        id: commit_repair
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "working_directory=$(pwd)"
            rm ../.github/workflows/frontend-format-repair.yml
            git -C .. config user.name "github-actions[bot]"
            git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C .. status --short
            git -C .. add .github admin-risk
            git -C .. status --short
            git -C .. -c core.hooksPath=/dev/null commit -m "style: apply frontend integration formatting"
            git -C .. push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          } 2>&1 | tee "$RUNNER_TEMP/frontend-format-commit.log"
      - name: Upload frontend format commit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-format-commit-diagnostics
          path: ${{ runner.temp }}/frontend-format-commit.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce frontend format commit
        if: always()
        run: test "${{ steps.commit_repair.outcome }}" = "success"
