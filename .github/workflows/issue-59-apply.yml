name: Issue 59 One-Time Patch

on:
  push:
    branches:
      - fix/issue-59-decimal-venue-fill-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-59-decimal-venue-fill-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Decimal reconciliation patch
        run: python scripts/issue-59-apply.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Decimal venue fill reconciliation"
          git push origin HEAD:fix/issue-59-decimal-venue-fill-reconciliation
