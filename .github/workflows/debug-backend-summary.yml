name: Debug Production Operations Summary

on:
  push:
    branches:
      - hardening/v6-production-gate-observability-backup-restore
    paths:
      - '.github/workflows/debug-backend-summary.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v6-production-gate-observability-backup-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: platform-backend
        run: python -m pip install -e '.[dev]'
      - name: Capture first failure in commit message
        shell: bash
        run: |
          set +e
          cd platform-backend
          python -m pytest tests/test_disaster_recovery.py tests/test_production_monitoring.py -vv > /tmp/production-ops-summary.log 2>&1
          status=$?
          cd ..
          summary=$(grep -m1 -E '^FAILED |^E   |^ERROR ' /tmp/production-ops-summary.log | tr '\n' ' ' | tr -cd '[:alnum:] _./:=-' | cut -c1-180)
          if [ -z "$summary" ]; then
            summary="exit-$status-no-failure-line"
          fi
          mkdir -p debug
          printf 'exit_code=%s\n%s\n' "$status" "$summary" > debug/production-ops-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/production-ops-summary.txt
          git commit -m "debug: $summary" || true
          git push origin HEAD:hardening/v6-production-gate-observability-backup-restore
