name: Hedge Board Market Snapshot CI Fix

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/hedge-board-market-snapshot-ci-fix.yml
      - scripts/apply-hedge-board-market-snapshot-ci-fix.py

permissions:
  contents: write

concurrency:
  group: hedge-board-market-snapshot-ci-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - name: Apply bounded CI cleanup
        run: python scripts/apply-hedge-board-market-snapshot-ci-fix.py

      - name: Install Platform API
        run: python -m pip install -e './platform-api[dev]'

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Validate bounded cleanup
        run: |
          python -m ruff check platform-api/tests/test_architecture_hedge_board_market_snapshot_data.py
          python -m pytest -q platform-api/tests/test_architecture_hedge_board_market_snapshot_data.py
          cd platform-web
          pnpm exec prettier --check src/views/hedgeBoard/index.vue
          python ../scripts/frontend-no-new-debt.py
          pnpm type:check
          cd ..
          git diff --check

      - name: Push validated cleanup
        run: |
          if git diff --quiet -- \
            platform-web/src/views/hedgeBoard/index.vue \
            platform-api/tests/test_architecture_hedge_board_market_snapshot_data.py; then
            echo 'Market snapshot CI cleanup is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform-web/src/views/hedgeBoard/index.vue \
            platform-api/tests/test_architecture_hedge_board_market_snapshot_data.py
          git commit -m 'fix: finalize market snapshot extraction guards'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
