name: Hedge Board TradingView Extraction

on:
  pull_request:
    branches:
      - feature/issue-134-platform-0-9-1-unified-delivery
    types: [synchronize]
    paths:
      - .github/workflows/hedge-board-tradingview-extraction.yml
      - scripts/apply-hedge-board-tradingview-extraction.py

permissions:
  contents: write

concurrency:
  group: hedge-board-tradingview-extraction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/issue-136-platform-0-9-2-system-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml

      - name: Apply mechanical extraction
        run: python scripts/apply-hedge-board-tradingview-extraction.py

      - name: Install frontend dependencies
        working-directory: platform-web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Validate extracted boundary
        run: |
          python -m pip install pytest
          python -m pytest -q platform-api/tests/test_architecture_hedge_board_tradingview_widget.py
          cd platform-web
          pnpm exec prettier --write \
            src/views/hedgeBoard/index.vue \
            src/views/hedgeBoard/components/TradingViewWidget.ts
          pnpm exec prettier --check \
            src/views/hedgeBoard/index.vue \
            src/views/hedgeBoard/components/TradingViewWidget.ts
          pnpm type:check
          cd ..
          git diff --check

      - name: Push validated extraction
        run: |
          if git diff --quiet -- \
            platform-web/src/views/hedgeBoard/index.vue \
            platform-web/src/views/hedgeBoard/components/TradingViewWidget.ts; then
            echo 'TradingViewWidget extraction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            platform-web/src/views/hedgeBoard/index.vue \
            platform-web/src/views/hedgeBoard/components/TradingViewWidget.ts
          git commit -m 'refactor: extract hedge board TradingView widget'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
