name: Issue 87 ESLint Diagnostic

on:
  push:
    branches:
      - fix/issue-87-homepage-responsive-layout

permissions:
  contents: read

jobs:
  homepage-eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-risk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: admin-risk/pnpm-lock.yaml
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Capture homepage ESLint output
        shell: bash
        run: |
          set +e
          pnpm exec eslint --max-warnings 0 src/views/dashboard/index.vue > /tmp/issue87-eslint.log 2>&1
          status=$?
          cat /tmp/issue87-eslint.log
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload homepage ESLint output
        uses: actions/upload-artifact@v4
        with:
          name: issue87-homepage-eslint
          path: /tmp/issue87-eslint.log
          retention-days: 1
