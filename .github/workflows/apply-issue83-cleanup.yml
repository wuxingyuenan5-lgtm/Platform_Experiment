name: Apply Issue 83 Cleanup

on:
  push:
    branches:
      - chore/issue-83-version-and-dead-code-cleanup
    paths:
      - scripts/apply_issue83_cleanup.py
      - .github/workflows/apply-issue83-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/issue-83-version-and-dead-code-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded cleanup
        run: python scripts/apply_issue83_cleanup.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            VERSION \
            platform-backend/pyproject.toml \
            platform-backend/app/application.py \
            execution-runtime/pyproject.toml \
            execution-runtime/app/main.py \
            admin-risk/.env \
            admin-risk/src/api/platform/trading.ts \
            admin-risk/src/api/platform/trading.types.ts \
            admin-risk/src/hooks/trading/usePlatformTrading.ts \
            scripts/check-version-consistency.py \
            .github/workflows/platform-ci.yml \
            docs/engineering/GIT_WORKFLOW.md \
            CHANGELOG.md
          git commit -m "Consolidate platform version and remove dead frontend order code"
          git push origin HEAD:chore/issue-83-version-and-dead-code-cleanup
