name: Bump integrated release to 0.9.1

on:
  push:
    branches:
      - release/0.9.1-user-system
    paths:
      - .github/workflows/bump-release-0.9.1.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.1-user-system
          fetch-depth: 0

      - name: Apply release version and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/bump-version.py 0.9.1
          git rm .github/workflows/bump-release-0.9.1.yml
          if [ -f .github/workflows/integrate-user-system-0.9.1.yml ]; then
            git rm .github/workflows/integrate-user-system-0.9.1.yml
          fi

          git add VERSION \
            platform-backend/pyproject.toml \
            execution-runtime/pyproject.toml \
            admin-risk/.env.development \
            admin-risk/.env.production
          git commit -m "chore: bump integrated platform to 0.9.1"
          git push origin HEAD:release/0.9.1-user-system
