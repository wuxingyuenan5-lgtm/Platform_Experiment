name: Apply EOD Policy Refactor

on:
  push:
    branches:
      - refactor/issue-79-eod-report-review-policy
    paths:
      - scripts/apply_eod_policy_refactor.py
      - .github/workflows/apply-eod-policy-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-79-eod-report-review-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded EOD policy updates
        run: python scripts/apply_eod_policy_refactor.py
      - name: Validate patch
        run: git diff --check
      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            platform-backend/app/eod_reconciliation.py \
            platform-backend/app/eod_reconciliation_repository.py \
            platform-backend/pyproject.toml \
            docs/architecture/OWNERSHIP.md \
            docs/codex/current-state.md \
            docs/engineering/TECHNICAL_DEBT.md \
            scripts/check-documentation-consistency.py \
            CHANGELOG.md
          git commit -m "Wire EOD decisions through pure policy"
          git push origin HEAD:refactor/issue-79-eod-report-review-policy
