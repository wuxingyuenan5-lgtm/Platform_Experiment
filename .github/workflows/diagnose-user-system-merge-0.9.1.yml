name: Diagnose remaining 0.9.1 merge conflicts

on:
  push:
    branches:
      - integration/0.9.1-merge-diagnostic
    paths:
      - .github/workflows/diagnose-user-system-merge-0.9.1.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/0.9.1-merge-diagnostic
          fetch-depth: 0

      - name: Record exact conflict list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/0.9.1-user-system-source

          set +e
          git merge --no-ff --no-commit origin/integration/0.9.1-user-system-source
          merge_status=$?
          set -e

          {
            echo "merge_status=$merge_status"
            echo "conflicting_files:"
            git diff --name-only --diff-filter=U
            echo
            echo "status:"
            git status --short
          } > /tmp/merge-conflicts-0.9.1.txt

          git merge --abort || true
          cp /tmp/merge-conflicts-0.9.1.txt docs/operations/MERGE_CONFLICTS_0.9.1.txt
          git rm .github/workflows/diagnose-user-system-merge-0.9.1.yml
          git add docs/operations/MERGE_CONFLICTS_0.9.1.txt
          git commit -m "chore: record remaining 0.9.1 merge conflicts"
          git push origin HEAD:integration/0.9.1-merge-diagnostic
