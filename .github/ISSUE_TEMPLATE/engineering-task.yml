name: Engineering task
description: Track a durable engineering outcome when an Issue is useful
title: "[Engineering] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use an Issue for work that benefits from durable coordination or review. Ordinary local work does not require a task card, Context Pack or management receipt.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user or system result should exist when this is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is included, and which adjacent work is explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Concrete evidence or checks that prove the outcome.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and safety
      description: Failure modes, protected semantics, external authorization needs and rollback boundary.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: Owning project or authority document to update, or `none`.
    validations:
      required: true
