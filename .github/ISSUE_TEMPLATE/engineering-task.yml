name: Engineering task
description: Create one tracked engineering workstream before opening a branch
title: "[Engineering] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Search existing open Issues and PRs first. Reuse an existing Issue when the outcome is already tracked.
  - type: textarea
    id: role
    attributes:
      label: Role
      description: Project owner, technical lead, investigation, implementation, acceptance or independent audit.
    validations:
      required: true
  - type: input
    id: context_pack
    attributes:
      label: Context Pack
      description: Stable task-type Pack name from scripts/context-packs.json.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority
      description: Direct authorization, owning authority, and when applicable the PR URL, commit range or evidence entry point.
    validations:
      required: true
  - type: textarea
    id: write_scope
    attributes:
      label: Write scope
      description: Exact files or ownership boundary the implementation agent may change.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One measurable outcome.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Adjacent work and refactors explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
      description: Conditions that require stopping work and escalating instead of expanding scope or authority.
    validations:
      required: true
  - type: textarea
    id: output_contract
    attributes:
      label: Output contract
      description: Short receipt using outcome, changed_files, validations, evidence, contract_impact, unproven_facts, residual_risks and next_gate.
    validations:
      required: true
  - type: textarea
    id: protected_semantics
    attributes:
      label: Protected semantics
      description: Trading, order-state, funds-safety, API, schema or Live Write behavior that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks required before merge.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Minimal context packet
      description: List the module entry document, direct source files and direct tests needed.
    validations:
      required: true
  - type: textarea
    id: contract_impact
    attributes:
      label: Contract impact
      description: Owning contracts affected, or `none`.
    validations:
      required: true
  - type: textarea
    id: unproven_facts
    attributes:
      label: Unproven facts and Token/context anomalies
      description: External facts not established and any repeated Pack or context-budget anomaly.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Risk and rollback
      description: Failure modes, detection and safe rollback.
    validations:
      required: true
