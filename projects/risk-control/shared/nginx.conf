server {
    listen 80;

    location /login {
        proxy_pass http://127.0.0.1:8080/login;
    }

    location /register {
        proxy_pass http://127.0.0.1:8080/register;
    }

    location /refresh {
        proxy_pass http://127.0.0.1:8080/refresh;
    }

    location /me {
        proxy_pass http://127.0.0.1:8080/me;
    }

    location /api/v1/data/ {
        proxy_pass http://127.0.0.1:8082/api/v1/data/;
    }

    location /api/v1/accounts {
        proxy_pass http://127.0.0.1:8082/api/v1/accounts;
    }

    location /dataApi/ {
        proxy_pass http://127.0.0.1:8082/;
    }
}
