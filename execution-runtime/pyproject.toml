[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variable-global-execution-runtime"
version = "0.9.3"
description = "Platform execution runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]
crypto = [
  "pybit>=5.17,<6.0",
]
mt5 = [
  "MetaTrader5>=5.0,<6.0",
]
all-gateways = [
  "pybit>=5.17,<6.0",
  "MetaTrader5>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "mt5*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "unit: deterministic adapter and protocol behavior without external effects",
  "integration: gateway, journal, bridge, and venue component collaboration",
  "live_safety: credential handling, connectivity, claims, and live-write safety",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
  "app/models.py",
  "app/runtime_contracts.py",
  "app/gateway.py",
]
exclude = ["tests"]
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Query metadata is intentionally declared in route signatures.
"app/main.py" = ["B008"]
# SQL and immutable snapshot identifiers are kept visibly auditable in persistent stores.
"app/venue_store.py" = ["E501"]
"app/live_route_store.py" = ["E501"]
# External venue field mappings are intentionally explicit and auditable.
"app/bybit_live_adapter.py" = ["E501"]
# Bounded Chase branches keep action/reconciliation tuples visible in one place.
"app/bybit_fill_confirming_adapter.py" = ["E501"]
# MT5 constants are accessed through a runtime-injected provider in tests and production.
"app/mt5_live_adapter.py" = ["E501", "B009"]
"tests/test_venue_query.py" = ["E501"]
"tests/test_bybit_live_adapter.py" = ["E501"]
"tests/test_mt5_live_adapter.py" = ["E501"]
