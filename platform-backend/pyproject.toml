[project]
name = "variable-global-platform-backend"
version = "0.2.0"
description = "Variable-Global modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route metadata is intentionally declared in the function signature.
# The quoted self-return annotation keeps the validator compatible with Pydantic's runtime model build.
"app/financial_facts.py" = ["B008", "UP037"]
# Phase 4A keeps the complete risk state machine in one auditable module; long SQL/error lines
# and Pydantic's quoted self annotation are accepted until the Phase 4 module split.
"app/execution_risk.py" = ["E501", "UP037"]
