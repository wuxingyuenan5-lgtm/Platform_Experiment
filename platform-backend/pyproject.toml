[project]
name = "variable-global-platform-backend"
version = "0.2.0"
description = "Variable-Global modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "architecture: static architecture and ownership boundary checks",
  "unit: deterministic domain calculations and isolated policies",
  "integration: API, persistence, orchestration, and component collaboration",
  "live_safety: fail-closed controls, production operations, and live-write safety",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
  "app/database_bootstrap.py",
  "app/database_connection.py",
  "app/database_seeds.py",
  "app/execution_schemas.py",
  "app/financial_fact_normalization.py",
  "app/financial_fact_repository.py",
  "app/financial_fact_schemas.py",
  "app/financial_projection_service.py",
  "app/position_math.py",
  "app/runtime_contracts.py",
  "app/schema_migrations.py",
  "app/schema_governance.py",
  "app/trade_command_execution.py",
  "app/venue_reconciliation_policy.py",
  "app/venue_reconciliation_repository.py",
  "app/venue_reconciliation_runtime_client.py",
  "app/venue_reconciliation_schemas.py",
  "app/venue_reconciliation_service.py",
]
exclude = ["tests"]
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route metadata is intentionally declared in the function signature.
"app/financial_facts.py" = ["B008"]
# Pydantic's quoted self-return annotation is required while the validator builds the model.
"app/financial_fact_schemas.py" = ["UP037"]
# Phase 4A keeps the complete risk state machine in one auditable module; long SQL/error lines
# and Pydantic's quoted self annotation are accepted until the Phase 4 module split.
"app/execution_risk.py" = ["E501", "UP037"]
# Venue Reconciliation facade preserves a legacy compatibility import pending usage migration.
"app/venue_reconciliation.py" = ["F401"]
"tests/test_venue_reconciliation.py" = ["E501"]
# Phase 4D keeps the synchronous EOD orchestration and API contract together for auditability.
"app/eod_reconciliation.py" = ["B008", "E501", "UP037"]
"tests/test_eod_reconciliation.py" = ["E501"]
# Production Gate keeps authentication policy and two-person live-session state explicit.
"app/auth.py" = ["E501"]
"app/live_trading_sessions.py" = ["E501", "UP037"]
"tests/test_auth_rbac.py" = ["E501"]
"tests/test_live_trading_sessions.py" = ["E501"]
# Production operations modules intentionally keep SQL, backup/restore validation, and the
# alert orchestration contract together for auditability. The lambda-binding and keys-view
# findings are non-functional and are tracked until the post-gate module split.
"app/disaster_recovery.py" = ["B023", "E501"]
"app/production_monitoring.py" = ["B008", "E501", "SIM118"]
"tests/test_disaster_recovery.py" = ["E501"]
"tests/test_production_monitoring.py" = ["E501"]
