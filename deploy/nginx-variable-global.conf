# Installed as /etc/nginx/sites-available/variable-global.conf.
# This file is included inside nginx's http {} block.
map $uri $variable_global_upstream {
    ~^/api/data(?:/|$) 127.0.0.1:8082;
    default 127.0.0.1:8080;
}

map $uri $variable_global_api_path {
    ~^/api/(?:auth|data)(/.*)$ $1;
    ~^/api/(?:auth|data)$ /;
    default $uri;
}

map $http_upgrade $variable_global_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 65.49.234.98 _;

    root /var/www/variable-global;
    index index.html;
    client_max_body_size 20m;

    # One location handles every backend API.
    location ^~ /api/ {
        proxy_pass http://$variable_global_upstream$variable_global_api_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $variable_global_connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
