stages:
  - build
  - deploy

variables:
  PNPM_VERSION: "9.15.9"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"

.frontend-job:
  image: node:20
  tags:
    - runner20
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - echo "registry=$NPM_CONFIG_REGISTRY" > ~/.npmrc
    - pnpm config set store-dir .pnpm-store
    - HUSKY=0 pnpm install --frozen-lockfile
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/

build-test:
  extends: .frontend-job
  stage: build
  script:
    - pnpm run build:test
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

build-prod:
  extends: .frontend-job
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^platform-web-.*$/'
      when: always
    - when: never

deploy-prod:
  stage: deploy
  image: alpine:3.20
  tags:
    - runner20
  needs:
    - job: build-prod
      artifacts: true
  before_script:
    - apk add --no-cache rsync
  script:
    - ': "${PLATFORM_WEB_DEPLOY_DIR:?PLATFORM_WEB_DEPLOY_DIR must be configured outside the repository}"'
    - ': "${PLATFORM_WEB_PUBLIC_URL:?PLATFORM_WEB_PUBLIC_URL must be configured outside the repository}"'
    - install -d "$PLATFORM_WEB_DEPLOY_DIR"
    - rsync -a --delete dist/ "$PLATFORM_WEB_DEPLOY_DIR/"
    - test -f "$PLATFORM_WEB_DEPLOY_DIR/index.html"
    - test -d "$PLATFORM_WEB_DEPLOY_DIR/assets"
    - echo "Platform Web deployed to $PLATFORM_WEB_PUBLIC_URL"
  environment:
    name: production
    url: $PLATFORM_WEB_PUBLIC_URL
  rules:
    - if: '$CI_COMMIT_TAG =~ /^platform-web-.*$/'
      when: manual
    - when: never
