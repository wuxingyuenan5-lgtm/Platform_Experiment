stages:
  - build

# 测试构建 job
build-test:
  stage: build
  image: node:18.19.0
  tags:
    - runner20
  variables:
    NPM_VERSION: "9.5.0"
    PNPM_VERSION: "8.1.0"
    NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  before_script:
    - npm install -g npm@$NPM_VERSION
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - echo "registry=https://registry.npmmirror.com" > ~/.npmrc
    - pnpm config set fetch-retries 5
    - pnpm config set fetch-retry-factor 2
    - pnpm config set fetch-retry-mintimeout 10000
    - pnpm config set fetch-retry-maxtimeout 600000
    - pnpm config set store-dir .pnpm-store
    - npm config set loglevel=warn
  script:
    - pnpm install
    - pnpm turbo run stub
    - pnpm run build:test
    - mkdir -p /www/wwwroot/risk-web.rta-office.com/
    - cp -R dist/* /www/wwwroot/risk-web.rta-office.com/
    - cp -R node_modules /www/wwwroot/risk-web.rta-office.com/
    - 'if [ ! -f /www/wwwroot/risk-web.rta-office.com/index.html ]; then echo "ERROR: index.html not found in target dir"; exit 1; fi'
    - 'if [ ! -d /www/wwwroot/risk-web.rta-office.com/assets ]; then echo "ERROR: assets directory not found"; exit 1; fi'
    - ls -l /www/wwwroot/risk-web.rta-office.com/ | head -n 20
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/
      - internal/*/dist/
  rules:
    - if: '$CI_COMMIT_TAG'     # 如果是 tag，不跑这个 job
      when: never
    - when: always             # 默认执行

# 正式构建 job
build-prod:
  stage: build
  image: node:18.19.0
  tags:
    - runner20
  variables:
    NPM_VERSION: "9.5.0"
    PNPM_VERSION: "8.1.0"
    NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  before_script:
    - npm install -g npm@$NPM_VERSION
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - echo "registry=https://registry.npmmirror.com" > ~/.npmrc
    - pnpm config set fetch-retries 5
    - pnpm config set fetch-retry-factor 2
    - pnpm config set fetch-retry-mintimeout 10000
    - pnpm config set fetch-retry-maxtimeout 600000
    - pnpm config set store-dir .pnpm-store
    - npm config set loglevel=warn
  script:
    - pnpm install
    - pnpm turbo run stub
    - pnpm run build
    - mkdir -p /www/wwwroot/risk-web.rta-office.com/
    - cp -R dist/* /www/wwwroot/risk-web.rta-office.com/
    - cp -R node_modules /www/wwwroot/risk-web.rta-office.com/
    - 'if [ ! -f /www/wwwroot/risk-web.rta-office.com/index.html ]; then echo "ERROR: index.html not found in target dir"; exit 1; fi'
    - 'if [ ! -d /www/wwwroot/risk-web.rta-office.com/assets ]; then echo "ERROR: assets directory not found"; exit 1; fi'
    - ls -l /www/wwwroot/risk-web.rta-office.com/ | head -n 20
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/
      - internal/*/dist/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^risk.*$/'
      when: always
    - when: never
